events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 100m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Keep edge-generated 413 responses JSON-shaped. Requests between the
  # application's 10 MiB limit and this edge limit are rejected by the API
  # itself, which can return the exact public protocol error envelope.
  map $request_uri $zgi_request_too_large_body {
    ~^/(?:anthropic/)?v1/messages(?:\?|$) '{"type":"error","error":{"type":"invalid_request_error","message":"Request body too large"}}';
    ~^/v1beta/models/                    '{"error":{"code":413,"message":"Request body too large","status":"RESOURCE_EXHAUSTED"}}';
    default                              '{"error":{"message":"Request body too large","type":"invalid_request_error","code":"llm.request.too_large","param":null}}';
  }

  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 2679;
    server_name _;

    error_page 413 = @zgi_request_too_large;

    location @zgi_request_too_large {
      internal;
      default_type application/json;
      add_header X-Content-Type-Options nosniff always;
      return 413 $zgi_request_too_large_body;
    }

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location = /ping {
      set $zgi_api http://api:2670;
      proxy_pass $zgi_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /console/api/ {
      set $zgi_api http://api:2670;
      proxy_pass $zgi_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /api/ {
      set $zgi_api http://api:2670;
      proxy_pass $zgi_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /swagger/ {
      set $zgi_api http://api:2670;
      proxy_pass $zgi_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
      # The API rejects requests above 10 MiB with a protocol-aware response.
      # A finite edge ceiling prevents very large or slow request bodies from
      # consuming upstream connections. It remains slightly above the API
      # limit so normal over-limit requests are handled by the API.
      client_max_body_size 12m;
      client_body_timeout 30s;
      set $zgi_api http://api:2670;
      proxy_pass $zgi_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_request_buffering on;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /anthropic/ {
      client_max_body_size 12m;
      client_body_timeout 30s;
      set $zgi_api http://api:2670;
      proxy_pass $zgi_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_request_buffering on;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /v1beta/ {
      client_max_body_size 12m;
      client_body_timeout 30s;
      set $zgi_api http://api:2670;
      proxy_pass $zgi_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_request_buffering on;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /files/ {
      set $zgi_api http://api:2670;
      proxy_pass $zgi_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      set $zgi_web http://web:2680;
      proxy_pass $zgi_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
