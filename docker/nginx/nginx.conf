events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  keepalive_timeout 65;
  client_max_body_size 100m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Keep edge-generated 413 responses JSON-shaped. Requests at or below this
  # edge limit but above the application's limit
  # (LLM_GATEWAY_REQUEST_BODY_LIMIT_MB, default 100 MiB) are rejected by the
  # API itself, which returns the exact public protocol error envelope. These
  # bodies mirror that envelope (gateway/handler/body_limit.go): the cataloged
  # llm.request.too_large code, the catalog's localized text, and the contract
  # fields applyProtocolErrorEnvelope adds to every protocol shape.
  map $http_accept_language $zgi_request_too_large_message {
    ~*^zh   '请求体过大，请缩减请求内容后重试。';
    default 'The request body is too large. Reduce the payload size and try again.';
  }

  map $request_uri $zgi_request_too_large_body {
    ~^/(?:anthropic/)?v1/messages(?:\?|$) '{"type":"error","error":{"type":"invalid_request_error","message":"$zgi_request_too_large_message"},"code":"llm.request.too_large","error_code":"llm.request.too_large","message":"$zgi_request_too_large_message","params":{},"retryable":false,"error_id":"$request_id","request_id":"$request_id"}';
    ~^/v1beta/models/                    '{"error":{"code":413,"message":"$zgi_request_too_large_message","status":"RESOURCE_EXHAUSTED"},"code":"llm.request.too_large","error_code":"llm.request.too_large","message":"$zgi_request_too_large_message","params":{},"retryable":false,"error_id":"$request_id","request_id":"$request_id"}';
    default                              '{"error":{"message":"$zgi_request_too_large_message","type":"invalid_request_error","code":"llm.request.too_large","param":null},"code":"llm.request.too_large","error_code":"llm.request.too_large","message":"$zgi_request_too_large_message","params":{},"retryable":false,"error_id":"$request_id","request_id":"$request_id"}';
  }

  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 2679;
    server_name _;

    error_page 413 = @zgi_request_too_large;

    location @zgi_request_too_large {
      internal;
      default_type application/json;
      add_header X-Content-Type-Options nosniff always;
      add_header X-ZGI-App-Error-Code llm.request.too_large always;
      return 413 $zgi_request_too_large_body;
    }

    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location = /ping {
      set $zgi_api http://api:2670;
      proxy_pass $zgi_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /console/api/ {
      set $zgi_api http://api:2670;
      proxy_pass $zgi_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /api/ {
      set $zgi_api http://api:2670;
      proxy_pass $zgi_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /swagger/ {
      set $zgi_api http://api:2670;
      proxy_pass $zgi_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
      # The API rejects requests above LLM_GATEWAY_REQUEST_BODY_LIMIT_MB
      # (default 100 MiB) with a protocol-aware response. This edge ceiling
      # matches that default; raise both together if the env goes above 100.
      # client_body_timeout is the idle time between two reads, not the total
      # upload time; 300s tolerates slow links on 100 MiB uploads. Request
      # buffering stays on so slow uploads occupy nginx, not the API.
      client_max_body_size 100m;
      client_body_timeout 300s;
      set $zgi_api http://api:2670;
      proxy_pass $zgi_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_request_buffering on;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /anthropic/ {
      client_max_body_size 100m;
      client_body_timeout 300s;
      set $zgi_api http://api:2670;
      proxy_pass $zgi_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_request_buffering on;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /v1beta/ {
      client_max_body_size 100m;
      client_body_timeout 300s;
      set $zgi_api http://api:2670;
      proxy_pass $zgi_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_request_buffering on;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /files/ {
      set $zgi_api http://api:2670;
      proxy_pass $zgi_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_request_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /api/connect/ {
      client_max_body_size 100m;
      proxy_request_buffering off;
      set $zgi_api http://api:2670;
      proxy_pass $zgi_api;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      set $zgi_web http://web:2680;
      proxy_pass $zgi_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
