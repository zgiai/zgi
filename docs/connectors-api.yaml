        - id
        - target
        - former_reference_id
        - label
        - reason_code
        - status
        - revision
      properties:
        id:
          type: string
          format: uuid
        target:
          $ref: "#/components/schemas/TargetRef"
        former_reference_id:
          type: string
        label:
          type: string
        reason_code:
          type: string
        status:
          type: string
          enum:
            - needs_replacement
            - explicitly_replaced
            - detached
        revision:
          type: integer
          minimum: 1
    ConnectorReferenceCommand:
      type: object
      additionalProperties: false
      required:
        - reference_id
        - expected_revision
        - action
      properties:
        reference_id: &a2
          type: string
          format: uuid
        expected_revision: &a3
          type: integer
          minimum: 1
        action: &a4
          type: string
          enum:
            - replace
            - detach
        connection_id: &a5
          type: string
          format: uuid
        operation_id: &a6
          type: string
    ConnectorReferenceResolveRequest:
      type: object
      additionalProperties: false
      required:
        - target
        - reference_id
        - expected_revision
        - action
      properties:
        target:
          $ref: "#/components/schemas/TargetRef"
        reference_id: *a2
        expected_revision: *a3
        action: *a4
        connection_id: *a5
        operation_id: *a6
