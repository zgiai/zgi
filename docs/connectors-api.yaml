      properties:
        external_effect:
          type: string
        description:
          type: string
        description_i18n:
          $ref: "#/components/schemas/LocalizedText"
        data_egress:
          type: boolean
        external_destination:
          type: string
    ConnectorRuntimeConfirmation:
      type: object
      description:
        Safe pre-execution confirmation emitted by Chat, Agent, and Workflow runtime events.
        Display translations come from the pinned operation, never from operation input.
      additionalProperties: false
      required:
        - route_receipt
        - connector_id
        - connector_name
        - operation_id
        - action_name
        - target
        - consequence
        - risk_classification
      properties:
        route_receipt:
          type: string
          format: uuid
        connector_id:
          type: string
        connector_name:
          type: string
        connector_name_i18n:
          $ref: "#/components/schemas/LocalizedText"
        operation_id:
          type: string
        action_name:
          type: string
        action_name_i18n:
          $ref: "#/components/schemas/LocalizedText"
        target:
          $ref: "#/components/schemas/TargetRef"
        consequence:
          $ref: "#/components/schemas/ConnectorRuntimeConsequence"
        risk_classification:
          enum:
            - high
            - unclassified
    ConnectorRuntimeStatusResponse:
      oneOf:
        - type: object
          additionalProperties: false
          required: [resolution]
          properties:
            resolution:
              enum: [unresolved]
        - type: object
          additionalProperties: false
          required: [resolution, state]
          properties:
            resolution:
              enum: [resolved]
            state:
              enum: [completed, cancelled, failed, unknown]
            decision_id:
              type: string
              format: uuid
            error_code:
              type: string
    ConnectorRuntimeConfirmationResponse:
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - state
          properties:
            state:
              enum:
                - cancelled
                - completed
            decision_id:
              type: string
              format: uuid
        - type: object
          additionalProperties: false
          required:
            - state
          properties:
            state:
              enum:
                - failed
                - unknown
            decision_id:
              type: string
              format: uuid
            error_code:
              type: string
              minLength: 1
              maxLength: 128
    RemovalImpact:
      type: object
      additionalProperties: false
      required:
        - connection_id
        - can_remove
        - affected_targets
      properties:
        connection_id:
          type: string
          format: uuid
        can_remove:
          type: boolean
        impact_token:
          type: string
        expires_at:
          type: string
          format: date-time
        affected_targets:
          type: array
          items:
            $ref: "#/components/schemas/TargetBinding"
    ConnectorUnavailableReference:
      type: object
