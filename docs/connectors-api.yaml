        usable_operation_ids:
          type: array
          items:
            type: string
        credential_configured:
          const: true
        credential_version:
          type: integer
          minimum: 1
        revision:
          type: integer
          minimum: 1
        last_verified_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PersonalConnectionDetail:
      allOf:
        - $ref: "#/components/schemas/PersonalConnection"
