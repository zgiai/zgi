        - name
        - state
        - revision
        - credential_configured
        - created_at
        - updated_at
      properties:
        provider_evidence:
          $ref: "#/components/schemas/AppProviderEvidence"
        id:
          type: string
          format: uuid
        connector_id:
          type: string
        name:
          type: string
        external_account_id:
          type: string
        external_display_name:
          type: string
        state:
