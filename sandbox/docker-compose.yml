services:
  sandbox:
    # Reap orphaned interpreter workers after cancellation or process failure.
    init: true
    # The entrypoint prepares delegated per-execution cgroups, then immediately
    # drops to the unprivileged zgi user before seeding profiles or starting Go.
    user: root
    # Nested Bubblewrap namespaces need elevated container isolation support.
    # Keep false for the preview backend; production linux-secure deployments
    # must explicitly opt in or run the Sandbox directly on a Linux worker.
    privileged: ${ZGI_SANDBOX_CONTAINER_PRIVILEGED:-false}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_REGION: ${BUILD_REGION:-global}
        GOPROXY: ${GOPROXY:-}
    image: zgi-sandbox:local
    env_file:
      - .env
    environment:
      ZGI_SANDBOX_DATABASE_URL: ${ZGI_SANDBOX_DATABASE_URL:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in sandbox/.env or your environment}@sandbox-postgres:5432/${POSTGRES_DB:-zgi_sandbox}?sslmode=disable}
      ZGI_SANDBOX_SERVER_PORT: ${ZGI_SANDBOX_SERVER_PORT:-2660}
      ZGI_SANDBOX_API_KEY: ${ZGI_SANDBOX_API_KEY:-}
      ZGI_SANDBOX_ADVERTISE_URL: http://localhost:${ZGI_SANDBOX_SERVER_PORT:-2660}
      ZGI_SANDBOX_PUBLIC_BASE_URL: http://localhost:${ZGI_SANDBOX_SERVER_PORT:-2660}
      ZGI_SANDBOX_DEPENDENCY_ROOTFS_DIR: ${ZGI_SANDBOX_DEPENDENCY_ROOTFS_DIR:-/var/lib/zgi-sandbox/dependency-rootfs}
      ZGI_SANDBOX_PREBUILT_DEPENDENCY_ROOTFS_DIR: ${ZGI_SANDBOX_PREBUILT_DEPENDENCY_ROOTFS_DIR:-/opt/zgi/prebuilt-dependency-rootfs}
      ZGI_SANDBOX_REQUIRED_DEPENDENCY_PROFILES: ${ZGI_SANDBOX_REQUIRED_DEPENDENCY_PROFILES:-skill-office,scientific-data}
      ZGI_SANDBOX_DEPENDENCY_BUILD_COMMAND: ${ZGI_SANDBOX_DEPENDENCY_BUILD_COMMAND:-/usr/local/bin/zgi-sandbox-build-dependency-profile}
      ZGI_SANDBOX_SECURE_RUNTIME_CGROUP_ROOT: ${ZGI_SANDBOX_SECURE_RUNTIME_CGROUP_ROOT:-/sys/fs/cgroup/zgi-sandbox-executions}
    networks:
      default:
      zgi-network:
        aliases:
          - zgi-sandbox
    ports:
      - "${ZGI_SANDBOX_SERVER_PORT:-2660}:${ZGI_SANDBOX_SERVER_PORT:-2660}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - sandbox-data:/var/lib/zgi-sandbox
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python3 -c \"import json, os, sys, urllib.request; port=os.environ.get('ZGI_SANDBOX_SERVER_PORT', '2660'); res=urllib.request.urlopen(f'http://127.0.0.1:{port}/ready', timeout=3); body=json.load(res); sys.exit(0 if res.getcode() == 200 and body.get('ready') is True else 1)\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in sandbox/.env or your environment}
    networks:
      default:
        aliases:
          - sandbox-postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    networks:
      default:
        aliases:
          - sandbox-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  sandbox-data:
  postgres-data:
  redis-data:

networks:
  zgi-network:
    external: true
    name: zgi-api_zgi-network
