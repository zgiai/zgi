name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Open source hygiene
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - name: Repair workspace ownership
        working-directory: ${{ runner.temp }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.22 \
            chown -R "$(id -u):$(id -g)" /workspace

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ripgrep
        run: |
          curl -fsSL https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ripgrep-14.1.1-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache: false

      - name: Check repository hygiene
        run: ./scripts/check-open-source.sh --worktree

      - name: Check migration source safety
        working-directory: api
        env:
          CONNECTOR_CREDENTIAL_ACTIVE_KEY_ID: ci
          CONNECTOR_CREDENTIAL_KEYS_JSON: '{"ci":"12345678901234567890123456789012"}'
        run: |
          go run ./cmd/migrate check
          go test ./internal/migrations -run '^TestCheck' -count=1

  web:
    name: Web lint, type check and build
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: web
    steps:
      - name: Repair workspace ownership
        working-directory: ${{ runner.temp }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.22 \
            chown -R "$(id -u):$(id -g)" /workspace

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.12.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run registration frontend and type checks
        run: ../scripts/check-registration-auth.sh --frontend-only

      - name: Run runtime delivery frontend gate
        run: bash ../scripts/check-runtime-delivery.sh --web

      - name: Check developer access error states
        run: pnpm test:developer-access-load-error

      - name: Check developer access quota units
        run: pnpm test:developer-access-credits

      - name: Check developer access refresh, audit and mobile navigation
        run: pnpm test:developer-access-live-audit

      - name: Test billing display reconciliation
        run: pnpm test:billing-display

      - name: Check permission-gated file creation entry
        run: pnpm test:file-sidebar-actions

      - name: Check exact Agent context action permissions
        run: pnpm test:agent-context-permissions

      - name: File context permissions
        working-directory: web
        run: pnpm test:file-context-permissions

      - name: Workspace home access regression
        run: pnpm test:workspace-home-access

      - name: Template entry route regression
        run: pnpm test:template-entry-route

      - name: Agent API access guard regression
        run: pnpm test:agent-api-access-guard

      - name: Workflow batch action permission regression
        run: pnpm test:batch-action-permissions

      - name: Clean generated web files
        if: always()
        run: |
          for path in node_modules .next; do
            if [ -e "$path" ]; then
              find "$path" -depth -delete
            fi
          done

  registration-auth:
    name: Registration and invitation gate
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    needs: web
    steps:
      - name: Repair workspace ownership
        working-directory: ${{ runner.temp }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.22 \
            chown -R "$(id -u):$(id -g)" /workspace

      - name: Checkout
        uses: actions/checkout@v4

      - name: Reclaim unused Docker data
        run: docker system prune --force

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache: false

      - name: Run registration and developer access gates
        run: |
          go_root="$(go env GOROOT)"
          cache_root="$RUNNER_TEMP/zgi-registration-auth-cache"
          mkdir -p "$cache_root/home" "$cache_root/go-build" "$cache_root/go"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --tmpfs /tmp:rw,exec,nosuid,size=4g \
            -e HOME=/cache/home \
            -e CGO_ENABLED=1 \
            -e GOCACHE=/cache/go-build \
            -e GOPATH=/cache/go \
            -e PATH=/opt/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -v "$go_root:/opt/go:ro" \
            -v "$cache_root:/cache" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            node:22-bookworm \
            bash -c './scripts/check-registration-auth.sh --backend-only && bash ./scripts/check-developer-access.sh && bash ./scripts/check-contextual-permissions.sh'

  api:
    name: API tests and vet
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    services:
      postgres:
        image: postgres:16.14-alpine3.24
        env:
          POSTGRES_DB: zgi_runtime_api_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: runtime-api-ci-only
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zgi_runtime_api_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CGO_ENABLED: '1'
      GOMAXPROCS: '2'
      GOGC: '50'
    steps:
      - name: Repair workspace ownership
        working-directory: ${{ runner.temp }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" alpine:3.22 \
            chown -R "$(id -u):$(id -g)" /workspace

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Enable test database extensions
        run: docker exec '${{ job.services.postgres.id }}' psql -U postgres -d zgi_runtime_api_ci -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp"'

      - name: Check runtime gate preflights
        run: bash scripts/test-runtime-delivery.sh

      - name: Run API delivery gate
        env:
          TEST_POSTGRES_DSN: postgres://postgres:runtime-api-ci-only@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/zgi_runtime_api_ci?sslmode=disable
          SQLMETA_TEST_DB_HOST: 127.0.0.1
          SQLMETA_TEST_DB_PORT: ${{ job.services.postgres.ports['5432'] }}
          SQLMETA_TEST_DB_USER: postgres
          SQLMETA_TEST_DB_PASS: runtime-api-ci-only
          SQLMETA_TEST_DB_NAME: zgi_runtime_api_ci
        run: |
          docker run --rm --network host \
            -e CGO_ENABLED=1 \
            -e GOMAXPROCS=2 \
            -e GOGC=50 \
            -e TEST_POSTGRES_DSN \
            -e SQLMETA_TEST_DB_HOST \
            -e SQLMETA_TEST_DB_PORT \
            -e SQLMETA_TEST_DB_USER \
            -e SQLMETA_TEST_DB_PASS \
            -e SQLMETA_TEST_DB_NAME \
            -e CONNECTOR_CREDENTIAL_ACTIVE_KEY_ID=runtime-delivery-test \
            -e CONNECTOR_CREDENTIAL_KEYS_JSON='{"runtime-delivery-test":"12345678901234567890123456789012"}' \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            golang:1.26.2-bookworm \
            bash -c 'apt-get update -qq && apt-get install -y -qq postgresql-client && bash scripts/check-runtime-delivery.sh --api'

  sandbox:
    name: Sandbox runtime tests
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: zgi_sandbox_ci
          POSTGRES_USER: zgi_sandbox
          POSTGRES_PASSWORD: zgi_sandbox_ci
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U zgi_sandbox -d zgi_sandbox_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        shell: bash
    steps:
      - name: Repair workspace ownership
        working-directory: ${{ runner.temp }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.22 \
            chown -R "$(id -u):$(id -g)" /workspace

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sandbox/go.mod
          cache-dependency-path: sandbox/go.sum

      - name: Install Kest
        env:
          KEST_VERSION: v0.7.7
          KEST_SHA256_LINUX_AMD64: 3814d8662a1cc01410302fcea43910f8437d01f969140c406f64b10249134a5a
          KEST_SHA256_LINUX_ARM64: 43d45c493bed73146928a2454ba6e712a5f68f02ebbfcefab978e0b4aa731b6d
        run: |
          case "$(uname -m)" in
            x86_64|amd64)
              archive="kest_linux_amd64.tar.gz"
              expected_sha="${KEST_SHA256_LINUX_AMD64}"
              ;;
            aarch64|arm64)
              archive="kest_linux_arm64.tar.gz"
              expected_sha="${KEST_SHA256_LINUX_ARM64}"
              ;;
            *)
              echo "unsupported runner architecture for sandbox Kest flow: $(uname -m)" >&2
              exit 1
              ;;
          esac

          curl -fsSL "https://github.com/kest-labs/kest/releases/download/${KEST_VERSION}/${archive}" -o "${RUNNER_TEMP}/${archive}"
          echo "${expected_sha}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" kest
          mkdir -p "${RUNNER_TEMP}/bin"
          mv "${RUNNER_TEMP}/kest" "${RUNNER_TEMP}/bin/kest"
          chmod +x "${RUNNER_TEMP}/bin/kest"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"

      - name: Install ripgrep
        run: |
          curl -fsSL https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-unknown-linux-musl.tar.gz \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/ripgrep-14.1.1-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: Set up Python with virtual environment support
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Run sandbox delivery gate
        env:
          CGO_ENABLED: '1'
          ZGI_SANDBOX_TEST_POSTGRES_ADMIN_DSN: postgres://zgi_sandbox:zgi_sandbox_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/zgi_sandbox_ci?sslmode=disable
          PGHOST: 127.0.0.1
          PGPORT: ${{ job.services.postgres.ports['5432'] }}
          PGUSER: zgi_sandbox
          PGPASSWORD: zgi_sandbox_ci
          PGDATABASE: zgi_sandbox_ci
        run: |
          docker run --rm --network host \
            -e CGO_ENABLED=1 \
            -e ZGI_SANDBOX_TEST_POSTGRES_ADMIN_DSN \
            -e PGHOST \
            -e PGPORT \
            -e PGUSER \
            -e PGPASSWORD \
            -e PGDATABASE \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            golang:1.26.2-bookworm \
            bash -c 'apt-get update -qq && apt-get install -y -qq postgresql-client python3 python3-venv && bash scripts/check-runtime-delivery.sh --sandbox'

      - name: Check sandbox config docs
        run: make -C sandbox check-config-docs

      - name: Run sandbox Kest flows
        env:
          ZGI_SANDBOX_DATABASE_URL: postgres://zgi_sandbox:zgi_sandbox_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/zgi_sandbox_ci?sslmode=disable
        run: make test-sandbox-kest

      - name: Verify personal key legacy quota guard on PostgreSQL
        working-directory: api
        env:
          ZGI_MIGRATION_TEST_DSN: postgres://zgi_sandbox:zgi_sandbox_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/zgi_sandbox_ci?sslmode=disable
        run: go test ./internal/migrations -run '^TestPersonalKeyLegacyQuotaMigration' -count=1 -v

  mcp-client:
    name: MCP client protocol and interoperability
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install independent Python MCP server
        run: python -m pip install mcp==2.3.0
      - name: Test MCP client, GitHub Connector and Python interoperability
        env:
          MCP_PYTHON_EXECUTABLE: python
        run: |
          go test ./pkg/mcpclient/... ./internal/modules/connectors/providers/githubmcp/... -count=1
          go test -race ./pkg/mcpclient/... -count=1

  ratingcore:
    name: ratingcore vector contract
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    steps:
      - name: Repair workspace ownership
        working-directory: ${{ runner.temp }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            alpine:3.22 \
            chown -R "$(id -u):$(id -g)" /workspace

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache: false

      # ratingcore is mirrored byte-for-byte from zgi-console. This test runs
      # the frozen cross-repo vectors and verifies the sha256 contract lock.
      - name: Verify ratingcore mirror vectors and hash lock
        working-directory: api
        run: go test ./internal/modules/llm/gateway/ratingcore/... -count=1 -v
