name: Docker Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional release version, for example v1.0.0 or 1.0.0"
        required: false
        type: string
      push_latest:
        description: "Also publish the latest tag for a manual release"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_NAMESPACE: zgiai

jobs:
  build-and-push:
    name: Build ${{ matrix.image }}
    runs-on: ${{ fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: zgi-api
            context: ./api
            dockerfile: ./api/Dockerfile
          - image: zgi-web
            context: ./web
            dockerfile: ./web/Dockerfile
          - image: zgi-sandbox
            context: ./sandbox
            dockerfile: ./sandbox/Dockerfile
          - image: zgi-runner
            context: ./runner
            dockerfile: ./runner/Dockerfile
          - image: zgi-agentworker
            context: ./sandbox
            dockerfile: ./sandbox/Dockerfile.agentworker
            platforms: linux/amd64
          - image: zgi-agent-runtime
            context: ./sandbox
            dockerfile: ./sandbox/Dockerfile.agent-runtime
            platforms: linux/amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare tags
        id: docker_tags
        shell: bash
        env:
          IMAGE: ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          INPUT_PUSH_LATEST: ${{ github.event.inputs.push_latest || 'false' }}
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::7}"
          version=""
          publish_latest="false"
          publish_minor="false"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Release tag must match vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-prerelease" >&2
              exit 1
            fi
            if [[ ! "${version}" == *-* ]]; then
              publish_latest="true"
              publish_minor="true"
            fi
          elif [[ -n "${INPUT_VERSION}" ]]; then
            version="${INPUT_VERSION#v}"
            if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "Manual release version must match MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-prerelease" >&2
              exit 1
            fi
            publish_latest="${INPUT_PUSH_LATEST}"
          fi

          minor=""
          if [[ "${publish_minor}" == "true" ]]; then
            minor="$(cut -d. -f1,2 <<< "${version}")"
          fi

          {
            echo "tags<<EOF"
            echo "${IMAGE}:sha-${short_sha}"
            if [[ -n "${version}" ]]; then
              echo "${IMAGE}:${version}"
            fi
            if [[ -n "${minor}" ]]; then
              echo "${IMAGE}:${minor}"
            fi
            if [[ "${publish_latest}" == "true" ]]; then
              echo "${IMAGE}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms || 'linux/amd64,linux/arm64' }}
          push: true
          tags: ${{ steps.docker_tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/zgiai/zgi
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.image }}

      - name: Record immutable image identity
        env:
          IMAGE: ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          jq -n --arg image "$IMAGE" --arg digest "$DIGEST" --arg revision "$GITHUB_SHA" \
            '{image: $image, digest: $digest, source_revision: $revision}' > image-identity.json

      - uses: actions/upload-artifact@v4
        with:
          name: image-identity-${{ matrix.image }}
          path: image-identity.json

  worker-binary:
    name: Package native Linux runtime Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate public deployment and archive examples
        run: bash scripts/test-runtime-distribution.sh
      - name: Export native Worker
        uses: docker/build-push-action@v6
        with:
          context: ./sandbox
          file: ./sandbox/Dockerfile.agentworker
          platforms: linux/amd64
          target: binary
          outputs: type=local,dest=runtime-worker
          cache-from: type=gha,scope=zgi-agentworker
      - name: Package operator files and checksums
        run: |
          bash scripts/package-runtime-worker.sh runtime-worker/zgi-agent-runtime-worker \
            zgi-agent-runtime-worker-linux-amd64.tar.gz "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: zgi-agent-runtime-worker-linux-amd64
          path: zgi-agent-runtime-worker-linux-amd64.tar.gz
