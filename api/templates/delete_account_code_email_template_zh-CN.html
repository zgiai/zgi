<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{brand_name}} - 账号注销验证</title>
</head>
<body style="margin:0;padding:32px 16px;background:#f0f2f5;color:#101828;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
  <div style="max-width:520px;margin:0 auto;padding:40px 48px;background:#fff;border-radius:16px;">
    <img src="{{logo_url}}" alt="{{brand_name}}" style="max-height:48px;width:auto;">
    <h1 style="margin:28px 0 12px;font-size:24px;">{{brand_name}} 账号注销验证</h1>
    <p style="color:#475467;line-height:1.7;">我们收到了注销您账号的请求。请使用下方验证码确认本次操作：</p>
    <div style="margin:24px 0;padding:20px;text-align:center;background:#f2f4f7;border-radius:12px;">
      <strong style="font-size:32px;letter-spacing:8px;">{{code}}</strong>
    </div>
    <p style="color:#475467;line-height:1.7;">验证码将在 5 分钟后失效。注销后，您的账号数据及所拥有的工作空间将进入永久删除流程。</p>
    <p style="color:#98a2b3;font-size:13px;line-height:1.6;">如果这不是您本人的操作，请忽略此邮件并尽快修改密码。</p>
  </div>
</body>
</html>
