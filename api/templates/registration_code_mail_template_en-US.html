<!doctype html>
<html lang="en-US">
  <body style="margin:0;background:#f4f6f8;font-family:Arial,sans-serif;color:#172033">
    <div style="max-width:520px;margin:40px auto;background:#fff;border-radius:12px;padding:32px">
      <h1 style="font-size:22px;margin:0 0 16px">Welcome to {{brand_name}}</h1>
      <p>Hello {{to}},</p>
      <p>Use the verification code below to finish creating your account. It expires in 10 minutes.</p>
      <div style="font-size:32px;font-weight:700;letter-spacing:8px;text-align:center;padding:20px;background:#f5f7ff;border-radius:8px">{{code}}</div>
      <p style="color:#667085;font-size:13px;margin-top:24px">If you did not start this registration, ignore this email. Do not share this code.</p>
    </div>
  </body>
</html>
