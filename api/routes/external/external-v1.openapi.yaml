        id: {type: string, format: uuid, description: 'Upload id passed as files[].upload_file_id in chat.'}
        name: {type: string, description: Original client-provided filename.}
        size: {type: integer, format: int64, description: Stored file size in bytes.}
        extension: {type: string, description: Normalized extension without a leading dot.}
        mime_type: {type: string, description: Detected or supplied media type.}
        created_by: {type: string, description: External user id that uploaded the file.}
        created_at: {type: integer, format: int64, description: Upload creation time in Unix seconds.}
      example:
        id: be2453d1-ec7e-42d5-920b-024cc6d477e9
        name: report.pdf
        size: 204800
        extension: pdf
        mime_type: application/pdf
        created_by: external-user-1
        created_at: 1788854400
    MemorySlotValue:
      type: object
      required: [id, key, name, description, max_chars, enabled, sort_order, content, revision, source_kind, created_at, updated_at, created_at_unix, updated_at_unix, created_at_iso, updated_at_iso, created_at_display, updated_at_display]
      properties:
        id: {type: string, format: uuid, description: Published slot definition id.}
        key: {type: string, description: Stable published slot key.}
        name: {type: string, description: User-facing slot name.}
        description: {type: string, description: Published slot description.}
        max_chars: {type: integer, minimum: 1, description: Maximum content length in Unicode characters.}
        enabled: {type: boolean, description: Whether the slot is enabled in the latest published configuration.}
        sort_order: {type: integer, description: Published display order.}
        content: {type: string, description: Current stored value; empty after a clear.}
        revision: {type: integer, format: int64, minimum: 0, description: Optimistic-concurrency revision.}
        source_kind: {type: string, description: Mutation source, such as manager or automatic extraction.}
        source_conversation_id: {type: string, format: uuid, description: Source conversation for automatically extracted values.}
        source_message_id: {type: string, format: uuid, description: Source message for automatically extracted values.}
        source_completed_at: {type: integer, format: int64, description: Source completion time in Unix seconds.}
        extractor_version: {type: string, description: Extractor version for automatically generated values.}
        last_operation_id: {type: string, format: uuid, description: Most recent mutation operation id.}
        undoable_until: {type: integer, format: int64, description: Unix-second deadline for undo when available.}
        created_at: {type: integer, format: int64, description: Unix seconds.}
        updated_at: {type: integer, format: int64, description: Unix seconds.}
        created_at_unix: {type: integer, format: int64, description: Alias of created_at.}
        updated_at_unix: {type: integer, format: int64, description: Alias of updated_at.}
        created_at_iso: {type: string, format: date-time, description: ISO-8601 creation time.}
        updated_at_iso: {type: string, format: date-time, description: ISO-8601 update time.}
        created_at_display: {type: string, description: Display-formatted creation time.}
        updated_at_display: {type: string, description: Display-formatted update time.}
      example:
        id: 0a154cc6-b5f0-4875-b2ba-642e0e8f37dd
        key: profile
        name: User profile
        description: Stable preferences
        max_chars: 2000
        enabled: true
        sort_order: 1
        content: Prefers concise answers
        revision: 3
        source_kind: manager
        last_operation_id: 72111957-9a76-49ec-b55a-c11b18b21ac4
        created_at: 1788850000
        updated_at: 1788854400
        created_at_unix: 1788850000
        updated_at_unix: 1788854400
        created_at_iso: '2026-09-08T06:46:40Z'
        updated_at_iso: '2026-09-08T08:00:00Z'
        created_at_display: '2026-09-08 06:46:40'
        updated_at_display: '2026-09-08 08:00:00'
    MemoryExport:
      type: object
      required: [agent_id, user_scope, user_id, exported_at, values]
      properties:
        agent_id: {type: string, format: uuid, description: Published Agent id.}
        user_scope: {type: string, enum: [end_user], description: External Agent Memory user scope.}
        user_id: {type: string, format: uuid, description: Workspace-and-Agent-scoped derived UUID, not the raw external id.}
        exported_at: {type: integer, format: int64, description: Export time in Unix seconds.}
        values:
          type: array
          description: Visible slots from the latest published Agent configuration.
          items: {$ref: '#/components/schemas/MemorySlotValue'}
      example:
        agent_id: 4c2cb782-748e-4ff4-a34d-796b40f98f16
        user_scope: end_user
        user_id: ef423f22-abfe-57fa-8320-cfca8d0fdf35
        exported_at: 1788854400
        values: []
    MemoryUndoResult:
      type: object
      required: [operation_id]
      properties:
        operation_id: {type: string, format: uuid, description: Operation that was undone.}
        value:
          allOf:
            - $ref: '#/components/schemas/MemorySlotValue'
          description: Restored slot value; omitted when the restored state has no value.
    Conversation:
      type: object
      description: Persisted conversation owned by the current external user.
      required: [id, organization_id, account_id, title, status, runtime_status, conversation_type, dialogue_count, source, created_at, updated_at]
      properties:
        id: {type: string, format: uuid, description: Conversation id used by detail, message, event, stop, and continuation endpoints.}
        organization_id: {type: string, format: uuid, description: Organization ownership scope.}
        workspace_id: {type: string, format: uuid, nullable: true, description: Workspace ownership scope when applicable.}
        account_id: {type: string, format: uuid, description: Server-side account scope associated with the conversation.}
        title: {type: string, description: User-facing conversation title.}
        status: {type: string, description: Lifecycle status such as normal or archived.}
        runtime_status: {type: string, description: Current execution state such as idle or running.}
        conversation_type: {type: string, description: Conversation mode, such as chat.}
        current_leaf_message_id: {type: string, format: uuid, nullable: true, description: Selected leaf message of the active branch.}
        active_message_id: {type: string, format: uuid, nullable: true, description: Message currently executing, or null when idle.}
        dialogue_count: {type: integer, minimum: 0, description: Persisted dialogue-turn count.}
        source: {type: string, example: external-api, description: Surface that created the conversation.}
        source_conversation_id: {type: string, nullable: true, description: Optional upstream conversation identifier supplied by the source surface.}
        source_web_app_id: {type: string, format: uuid, nullable: true, description: Published web application that originated the conversation.}
        metadata: {type: object, additionalProperties: true, description: Extensible runtime and presentation metadata; clients must ignore unknown keys.}
        created_at: {type: integer, format: int64, description: Unix timestamp in seconds.}
        updated_at: {type: integer, format: int64, description: Unix timestamp in seconds.}
    Message:
      type: object
      description: Persisted user-and-assistant dialogue message in a conversation branch.
      required: [id, conversation_id, query, answer, status, model_name, created_at, updated_at]
      properties:
        id: {type: string, format: uuid, description: Message id used for regeneration and event correlation.}
        conversation_id: {type: string, format: uuid, description: Owning conversation id.}
        parent_id: {type: string, format: uuid, nullable: true, description: Parent message id in the conversation branch.}
        query: {type: string, description: Persisted user input for this dialogue turn.}
        answer: {type: string, description: Persisted assistant answer accumulated from the stream.}
        status: {type: string, description: Message lifecycle status such as running, completed, stopped, or failed.}
        error: {type: string, nullable: true, description: Persisted failure detail when the message did not complete normally.}
        model_provider: {type: string, nullable: true, description: Provider recorded for the published model.}
        model_name: {type: string, description: Model name recorded for the message.}
        billing_reason_source: {type: string, nullable: true, description: Optional billing-attribution source.}
        model_parameters: {type: object, additionalProperties: true, description: Model parameters recorded at execution time.}
        metadata: {type: object, additionalProperties: true, description: Extensible message metadata; clients must ignore unknown keys.}
        source_message_id: {type: string, nullable: true, description: Optional upstream message identifier supplied by the source surface.}
        created_at: {type: integer, format: int64, description: Unix timestamp in seconds.}
        updated_at: {type: integer, format: int64, description: Unix timestamp in seconds.}
    SearchResult:
      type: object
      description: Conversation-title or message-content match returned by conversation search.
      required: [type, conversation_id, conversation_title, snippet, updated_at]
      properties:
        type: {type: string, enum: [conversation, message], description: Entity that matched the query.}
        conversation_id: {type: string, format: uuid, description: Conversation containing the match.}
        conversation_title: {type: string, description: Current conversation title.}
        message_id: {type: string, format: uuid, nullable: true, description: Matching message id; null for a conversation-title match.}
        snippet: {type: string, description: Short matched-text preview for display.}
        updated_at: {type: integer, format: int64, description: Unix timestamp in seconds.}
    ConversationList:
      type: object
      description: Paginated conversation collection.
      required: [data, page, limit, total, has_more]
      properties:
        data:
          type: array
          description: Conversations in descending update-time order.
          items: {$ref: '#/components/schemas/Conversation'}
        page: {type: integer, minimum: 1, description: One-based page number.}
        limit: {type: integer, minimum: 1, maximum: 100, description: Requested page size.}
        total: {type: integer, format: int64, minimum: 0, description: Total matching conversations.}
        has_more: {type: boolean, description: Whether another page is available.}
    MessageList:
      type: object
      description: Paginated persisted-message collection.
      required: [data, page, limit, total, has_more]
      properties:
        data:
          type: array
          description: Messages in persisted conversation order.
          items: {$ref: '#/components/schemas/Message'}
        page: {type: integer, minimum: 1, description: One-based page number.}
        limit: {type: integer, minimum: 1, maximum: 200, description: Requested page size.}
        total: {type: integer, format: int64, minimum: 0, description: Total persisted messages in the conversation.}
        has_more: {type: boolean, description: Whether another page is available.}
    ConversationEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/Conversation'}
    ConversationListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/ConversationList'}
    MessageListEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/MessageList'}
    SearchResultsEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: array
              description: Ordered conversation-title and message-content matches.
              items: {$ref: '#/components/schemas/SearchResult'}
    StopConversationEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              description: Conversation execution state after the stop request.
              required: [conversation_id, runtime_status, status]
              properties:
                conversation_id: {type: string, format: uuid, description: Conversation that received the stop request.}
                message_id: {type: string, format: uuid, nullable: true, description: Active message targeted by the stop request, if one existed.}
                runtime_status: {type: string, description: Conversation runtime state after the request.}
                status: {type: string, description: Stop operation result.}
    DeleteConversationEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              description: Deletion confirmation payload.
              required: [result]
              properties:
                result: {type: string, enum: [success], description: Fixed success marker.}
              example: {result: success}
    MemoryExportEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/MemoryExport'}
    MemorySlotEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/MemorySlotValue'}
    MemorySettings:
      type: object
      required: [memory_enabled, auto_capture_enabled, settings_revision, memory_epoch]
      properties:
        memory_enabled: {type: boolean, description: Whether memory is enabled for this final user and published Agent.}
        auto_capture_enabled: {type: boolean, description: Whether automatic memory capture is enabled for this final user.}
        settings_revision: {type: integer, format: int64, minimum: 0, description: Optimistic concurrency revision for memory settings updates.}
        memory_epoch: {type: integer, format: int64, minimum: 0, description: Memory generation used to invalidate earlier pending mutations after a clear.}
    MemorySettingsEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/MemorySettings'}
    MemoryClearEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              description: Clear-all confirmation payload.
              required: [deleted]
              properties:
                deleted: {type: boolean, enum: [true], description: True after all writable values are cleared.}
              example: {deleted: true}
    MemoryUndoEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data: {$ref: '#/components/schemas/MemoryUndoResult'}
    MemoryHistoryVersion:
      type: object
      required: [id, key, action, before, after, content_purged, revertible]
      properties:
        id: {type: string, format: uuid}
        key: {type: string}
        definition_id: {type: string, format: uuid}
        action: {type: string, enum: [create, update, delete, clear, undo]}
        before_revision: {type: integer, format: int64}
        after_revision: {type: integer, format: int64}
        before: {type: string, description: Content before the change; empty when purged or absent.}
        after: {type: string, description: Content after the change; empty when purged or removed.}
        evidence: {type: string, description: The user's words the change was based on.}
        reason: {type: string, description: Why the change was made.}
        content_purged: {type: boolean}
        revertible: {type: boolean}
    MemoryHistoryCommit:
      type: object
      required: [id, source_kind, actor_type, source, created_at, versions]
      properties:
        id: {type: string, format: uuid}
        source_kind: {type: string, description: 'explicit, automatic, or manager.'}
        actor_type: {type: string}
        source: {type: string}
        conversation_id: {type: string, format: uuid}
        message_id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
        versions:
          type: array
          items: {$ref: '#/components/schemas/MemoryHistoryVersion'}
    MemoryHistoryEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [commits]
              properties:
                commits:
                  type: array
                  items: {$ref: '#/components/schemas/MemoryHistoryCommit'}
                next_before: {type: string, format: date-time}
    MemoryArchiveEntry:
      type: object
      required: [id, content, created_at]
      properties:
        id: {type: string, format: uuid}
        content: {type: string, description: The archived text.}
        tags: {type: string, description: Kind of memory the text came from.}
        source_key: {type: string, description: The memory slot the text was moved out of.}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    MemoryArchiveEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  items: {$ref: '#/components/schemas/MemoryArchiveEntry'}
    MemoryArchiveDeleteEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [entry_id]
              properties:
                entry_id: {type: string, format: uuid}
    MemoryRevertEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          required: [data]
          properties:
            data:
              type: object
              required: [version_id]
              properties:
                version_id: {type: string, format: uuid}
                item:
                  description: The slot after the revert, or null when the revert removed it.
                  nullable: true
                  type: object
    SuccessEnvelope:
      type: object
      description: Standard JSON success envelope. Compatibility discovery and upload endpoints return direct objects instead.
      required: [code, message]
      properties:
        code: {type: string, example: '0', description: String success code; zero means success.}
        message: {type: string, example: success, description: Human-readable result message.}
        data: {description: Endpoint-specific success payload.}
    ErrorEnvelope:
      type: object
      description: Standard JSON error envelope returned for validation, authorization, ownership, conflict, and server errors.
      required: [code, message]
      properties:
        code: {type: string, example: '199001', description: Stable application error code represented as a string.}
        message: {type: string, example: Invalid parameter, description: Human-readable failure reason.}
