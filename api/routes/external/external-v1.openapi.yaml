openapi: 3.0.3
info:
  title: ZGI External Agent API
  version: 1.0.0
  description: |-
    Server-side API for building a frontend on a published ZGI Agent.
    Streaming operations use native Server-Sent Events. Each `data:` line is an
    `SSEEnvelope`; dispatch on the native `event:` value and read its matching
    payload schema from `x-zgi-sse-event-data-schemas` below.
x-zgi-sse-event-data-schemas:
  message_start: '#/components/schemas/MessageStartEventData'
  message: '#/components/schemas/MessageEventData'
  message_retract: '#/components/schemas/MessageRetractEventData'
  message_end: '#/components/schemas/MessageEndEventData'
  error: '#/components/schemas/ErrorEventData'
  agent_progress: '#/components/schemas/AgentProgressEventData'
  agent_intermediate_answer: '#/components/schemas/IntermediateAnswerEventData'
  user_input_requested: '#/components/schemas/UserInputRequestedEventData'
  token_budget_requested: '#/components/schemas/TokenBudgetRequestedEventData'
  token_usage_updated: '#/components/schemas/TokenUsageUpdatedEventData'
  file_parse_start: '#/components/schemas/FileParseEventData'
  file_parse_end: '#/components/schemas/FileParseEventData'
  file_parse_error: '#/components/schemas/FileParseEventData'
  skill_load_start: '#/components/schemas/SkillEventData'
  skill_load_end: '#/components/schemas/SkillEventData'
  skill_reference_read: '#/components/schemas/SkillEventData'
  skill_call_start: '#/components/schemas/SkillEventData'
  skill_call_end: '#/components/schemas/SkillEventData'
  skill_call_error: '#/components/schemas/SkillEventData'
  skill_artifact_created: '#/components/schemas/SkillArtifactEventData'
  tool_governance_decision: '#/components/schemas/ToolGovernanceDecisionEventData'
  memory_create: '#/components/schemas/MemoryMutationEventData'
  memory_update: '#/components/schemas/MemoryMutationEventData'
  memory_delete: '#/components/schemas/MemoryMutationEventData'
  memory_clear: '#/components/schemas/MemoryMutationEventData'
  workflow_started: '#/components/schemas/WorkflowEventData'
  node_started: '#/components/schemas/WorkflowEventData'
  node_finished: '#/components/schemas/WorkflowEventData'
  workflow_paused: '#/components/schemas/WorkflowEventData'
  workflow_resumed: '#/components/schemas/WorkflowEventData'
  approval_requested: '#/components/schemas/ApprovalRequestedEventData'
  approval_result_filled: '#/components/schemas/WorkflowEventData'
  approval_expired: '#/components/schemas/WorkflowEventData'
  question_answer_requested: '#/components/schemas/WorkflowEventData'
  question_answer_submitted: '#/components/schemas/WorkflowEventData'
  iteration_started: '#/components/schemas/WorkflowEventData'
  iteration_next: '#/components/schemas/WorkflowEventData'
  iteration_completed: '#/components/schemas/WorkflowEventData'
  iteration_succeeded: '#/components/schemas/WorkflowEventData'
  iteration_failed: '#/components/schemas/WorkflowEventData'
  loop_started: '#/components/schemas/WorkflowEventData'
  loop_next: '#/components/schemas/WorkflowEventData'
  loop_completed: '#/components/schemas/WorkflowEventData'
  loop_succeeded: '#/components/schemas/WorkflowEventData'
  loop_failed: '#/components/schemas/WorkflowEventData'
  workflow_finished: '#/components/schemas/WorkflowEventData'
  workflow_failed: '#/components/schemas/WorkflowEventData'
  workflow_stopped: '#/components/schemas/WorkflowEventData'
  text_chunk: '#/components/schemas/WorkflowTextEventData'
  text_replace: '#/components/schemas/WorkflowTextEventData'
servers:
  - url: /api/v1
security:
  - bearerAuth: []
  - apiKeyAuth: []
tags:
  - name: Agent
  - name: Conversations
  - name: Continuations
  - name: Memory
paths:
  /info:
    get:
      tags: [Agent]
      summary: Get legacy-compatible published application metadata
      operationId: getPublishedApplicationInfo
      description: Returns direct JSON metadata for the latest published application bound to this API key. This read-only endpoint does not require an external-user id.
      responses:
        '200':
          description: Published application metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedApplicationInfo'
        default:
          $ref: '#/components/responses/Error'
  /parameters:
    get:
      tags: [Agent]
      summary: Get legacy-compatible inputs, features, and file limits
      operationId: getPublishedApplicationParameters
      description: Returns direct JSON containing published presentation features, workflow start variables, upload capabilities, Agent Memory flags, and current server limits.
      responses:
        '200':
          description: Published runtime parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishedApplicationParameters'
        default:
          $ref: '#/components/responses/Error'
  /agents/config:
    get:
      tags: [Agent]
      summary: Get published landing-page configuration
      operationId: getPublishedAgentConfig
      description: Returns the latest published public fields needed to render an Agent landing page. Draft settings, model credentials, and internal runtime configuration are never returned.
      responses:
        '200':
          description: Published Agent presentation and capability flags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /files/upload:
    post:
      tags: [Agent]
      summary: Upload a file for a subsequent Agent message
      operationId: uploadAgentFile
      description: Uploads a temporary file owned by the external user. Put the returned `id` in a later chat request's `file_ids`.
      parameters:
        - $ref: '#/components/parameters/ExternalUserID'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                user:
                  type: string
                  deprecated: true
                  description: Deprecated compatibility field. Use `X-External-User-ID`.
                file:
                  type: string
                  format: binary
                  description: Required file body. Check `/parameters` for the server's current types and limits.
      responses:
        '201':
          description: Uploaded file metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFile'
        default:
          $ref: '#/components/responses/Error'
  /agents/chat:
    post:
      tags: [Agent]
      summary: Stream a published Agent response
      operationId: streamPublishedAgentResponse
      description: Creates or continues an external-user-scoped conversation using the latest published Agent configuration and streams native SSE events. External model/provider/parameter overrides are not applied.
      parameters:
        - $ref: '#/components/parameters/ExternalUserID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          $ref: '#/components/responses/AgentEventStream'
        default:
          $ref: '#/components/responses/Error'
  /agents/conversations:
    get:
      tags: [Conversations]
      summary: List conversations owned by this API key
      operationId: listAgentConversations
      description: Lists only conversations created by this API key's bound Agent for the supplied external user, ordered by latest update.
      parameters:
        - $ref: '#/components/parameters/ExternalUserID'
        - $ref: '#/components/parameters/LegacyUser'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          $ref: '#/components/responses/ConversationListEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /agents/conversations/search:
    get:
      tags: [Conversations]
      summary: Search conversations and messages
      operationId: searchAgentConversations
      description: Searches conversation titles, user queries, and assistant answers in the supplied external user's scope. Blank query text returns an empty array.
      parameters:
        - $ref: '#/components/parameters/ExternalUserID'
        - $ref: '#/components/parameters/LegacyUser'
        - name: query
          in: query
          description: Text to find in conversation titles or message content.
          schema: {type: string}
        - $ref: '#/components/parameters/SearchLimit'
      responses:
        '200':
          $ref: '#/components/responses/SearchResultsEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /agents/conversations/{conversation_id}:
    parameters:
      - $ref: '#/components/parameters/ConversationID'
      - $ref: '#/components/parameters/ExternalUserID'
      - $ref: '#/components/parameters/LegacyUser'
    get:
      tags: [Conversations]
      summary: Get a conversation
      operationId: getAgentConversation
      description: Returns one conversation only when it belongs to the API key's bound Agent and supplied external user.
      responses:
        '200':
          $ref: '#/components/responses/ConversationEnvelope'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [Conversations]
      summary: Rename or update a conversation
      operationId: updateAgentConversation
      description: Updates only supplied fields and returns the complete conversation object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConversationRequest'
      responses:
        '200':
          $ref: '#/components/responses/ConversationEnvelope'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Conversations]
      summary: Delete a conversation
      operationId: deleteAgentConversation
      description: Soft-deletes a conversation owned by the supplied external user.
      responses:
        '200':
          $ref: '#/components/responses/DeleteConversationEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /agents/conversations/{conversation_id}/messages:
    get:
      tags: [Conversations]
      summary: List messages in a conversation
      operationId: listAgentConversationMessages
      description: Returns persisted message history for an external-user-owned conversation.
      parameters:
        - $ref: '#/components/parameters/ConversationID'
        - $ref: '#/components/parameters/ExternalUserID'
        - $ref: '#/components/parameters/LegacyUser'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/MessageLimit'
      responses:
        '200':
          $ref: '#/components/responses/MessageListEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /agents/conversations/{conversation_id}/files/{file_id}:
    get:
      tags: [Conversations]
      summary: Read a protected execution result file
      operationId: readAgentExecutionFile
      description: Returns file bytes only after checking the current application, external user and conversation access. The user must match the original conversation owner. Protected artifacts omit public URLs; use this authenticated endpoint for preview or download. Retained files remain readable when Linux execution is disabled, but not after access is revoked.
      parameters:
        - $ref: '#/components/parameters/ConversationID'
        - $ref: '#/components/parameters/ExternalUserID'
        - $ref: '#/components/parameters/LegacyUser'
        - name: file_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: download
          in: query
          description: Return an attachment instead of an inline preview.
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Authenticated file bytes with private no-store caching.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '206':
          description: Requested byte range of the authenticated file.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        default:
          $ref: '#/components/responses/Error'
  /agents/conversations/{conversation_id}/events:
    get:
      tags: [Conversations]
      summary: Recover a running Agent SSE stream
      operationId: recoverAgentEventStream
      description: Replays recoverable events after `after_id` and remains connected while the message is active. Events are retained for a limited period and this endpoint never creates a new message.
      parameters:
        - $ref: '#/components/parameters/ConversationID'
        - $ref: '#/components/parameters/ExternalUserID'
        - $ref: '#/components/parameters/LegacyUser'
        - name: message_id
          in: query
          required: true
          description: Assistant message id returned by `message_start` or `X-ZGI-Message-ID`.
          schema: {type: string, format: uuid}
        - name: after_id
          in: query
          description: Last SSE `id` received by the client. Omit to replay from the beginning of the recoverable stream.
          schema: {type: string}
      responses:
        '200':
          $ref: '#/components/responses/AgentEventStream'
        default:
          $ref: '#/components/responses/Error'
  /agents/conversations/{conversation_id}/stop:
    post:
      tags: [Conversations]
      summary: Stop the active Agent response
      operationId: stopAgentConversation
      description: Cancels the current model generation, Skill execution, or workflow continuation for the conversation.
      parameters:
        - $ref: '#/components/parameters/ConversationID'
        - $ref: '#/components/parameters/ExternalUserID'
        - $ref: '#/components/parameters/LegacyUser'
      responses:
        '200':
          $ref: '#/components/responses/StopConversationEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /agents/messages/{message_id}/regenerate:
    post:
      tags: [Conversations]
      summary: Regenerate a root message using published Agent settings
      operationId: regenerateAgentMessage
      description: Creates a replacement assistant message using the latest published model and parameters. An empty body reuses the original query.
      parameters:
        - $ref: '#/components/parameters/MessageID'
        - $ref: '#/components/parameters/ExternalUserID'
        - $ref: '#/components/parameters/LegacyUser'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegenerateMessageRequest'
      responses:
        '200':
          $ref: '#/components/responses/AgentEventStream'
        default:
          $ref: '#/components/responses/Error'
  /agents/conversations/{conversation_id}/messages/{message_id}/workflow-continuation:
    post:
      tags: [Continuations]
      summary: Continue a paused workflow question or approval
      operationId: continueAgentWorkflow
      description: Continues the same message after `question_answer_requested`, its `user_input_requested` projection with `source=agent_workflow_question_answer`, or `approval_requested`. A continuation can enter another waiting state.
      parameters:
        - $ref: '#/components/parameters/ConversationID'
        - $ref: '#/components/parameters/MessageID'
        - $ref: '#/components/parameters/ExternalUserID'
        - $ref: '#/components/parameters/LegacyUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowContinuationRequest'
      responses:
        '200':
          $ref: '#/components/responses/AgentEventStream'
        default:
          $ref: '#/components/responses/Error'
  /agents/conversations/{conversation_id}/messages/{message_id}/tool-governance/{correlation_id}/continue:
    post:
      tags: [Continuations]
      summary: Confirm or reject a paused platform CLI tool call
      operationId: continueAgentPlatformToolGovernance
      description: Requires an admitted Linux session and the same verified final user. Confirmation executes the frozen business invocation once, never the original Shell. Current application, publication and resource authorization are rechecked; approval cannot grant an unbound resource. Rejection remains available after execution is disabled. Duplicate decisions recover the existing result. This endpoint does not accept Runtime Workspace credentials or workflow approval tokens.
      parameters:
        - $ref: '#/components/parameters/ConversationID'
        - $ref: '#/components/parameters/MessageID'
        - name: correlation_id
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 256}
        - $ref: '#/components/parameters/ExternalUserID'
        - $ref: '#/components/parameters/LegacyUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [approve, reject]}
                reason: {type: string}
                remember_for_session: {type: boolean, default: false, description: Per-invocation policies ignore this flag.}
      responses:
        '200':
          $ref: '#/components/responses/AgentEventStream'
        default:
          $ref: '#/components/responses/Error'
  /agents/conversations/{conversation_id}/messages/{message_id}/user-input/{request_id}/continue:
    post:
      tags: [Continuations]
      summary: Answer a Skill user-input request
      operationId: continueAgentUserInput
      description: Continues the same message after a Skill `user_input_requested`. Do not use this endpoint when `source=agent_workflow_question_answer`; that projected workflow event uses workflow continuation. Use each question id as an `answers` key.
      parameters:
        - $ref: '#/components/parameters/ConversationID'
        - $ref: '#/components/parameters/MessageID'
        - name: request_id
          in: path
          required: true
          description: Request id copied from the active Skill `user_input_requested` event whose source is not `agent_workflow_question_answer`.
          schema: {type: string}
        - $ref: '#/components/parameters/ExternalUserID'
        - $ref: '#/components/parameters/LegacyUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInputContinuationRequest'
      responses:
        '200':
          $ref: '#/components/responses/AgentEventStream'
        default:
          $ref: '#/components/responses/Error'
  /agents/conversations/{conversation_id}/messages/{message_id}/token-budget/{request_id}/continue:
    post:
      tags: [Continuations]
      summary: Continue or stop an API task paused by its token budget
      operationId: continueAgentTaskTokenBudget
      description: Adds tokens to, or stops, the same message after `token_budget_requested`. This endpoint is independent from Skill `user_input_requested`; do not send `answers`.
      parameters:
        - $ref: '#/components/parameters/ConversationID'
        - $ref: '#/components/parameters/MessageID'
        - name: request_id
          in: path
          required: true
          description: Request id copied from the active `token_budget_requested` event.
          schema: {type: string}
        - $ref: '#/components/parameters/ExternalUserID'
        - $ref: '#/components/parameters/LegacyUser'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskTokenBudgetContinuationRequest'
      responses:
        '200':
          $ref: '#/components/responses/AgentEventStream'
        default:
          $ref: '#/components/responses/Error'
  /agents/conversations/{conversation_id}/messages/{message_id}/resume:
    post:
      tags: [Continuations]
      summary: Resume a task stopped by a server restart
      operationId: resumeAgentInterruptedTurn
      description: Resumes the same message after the process running it stopped, which leaves the message `error` with `runtime_lease_expired`. The task continues from its recorded model responses and tool results instead of starting over. A message can be resumed once, only while it is the latest turn of its conversation, and only when no unfinished tool call could have changed anything; otherwise the stream sends an `error` event with code `interrupted_turn_not_resumable`.
      parameters:
        - $ref: '#/components/parameters/ConversationID'
        - $ref: '#/components/parameters/MessageID'
        - $ref: '#/components/parameters/ExternalUserID'
        - $ref: '#/components/parameters/LegacyUser'
      responses:
        '200':
          $ref: '#/components/responses/AgentEventStream'
        default:
          $ref: '#/components/responses/Error'
  /agents/memory:
    get:
      tags: [Memory]
      summary: Read the external user's Agent Memory
      operationId: getAgentMemory
      description: Returns visible slots from the latest published Agent configuration and values owned by the supplied external user.
      parameters:
        - $ref: '#/components/parameters/ExternalUserID'
        - $ref: '#/components/parameters/LegacyUser'
      responses:
        '200':
          $ref: '#/components/responses/MemoryExportEnvelope'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Memory]
      summary: Clear the external user's writable Agent Memory
      operationId: clearAgentMemory
      description: Clears all writable values for the external user without changing published slot definitions.
      parameters:
        - $ref: '#/components/parameters/ExternalUserID'
        - $ref: '#/components/parameters/LegacyUser'
      responses:
        '200':
          $ref: '#/components/responses/MemoryClearEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /agents/memory/export:
    get:
      tags: [Memory]
      summary: Export the external user's Agent Memory
      operationId: exportAgentMemory
      description: Returns the same JSON envelope as `GET /agents/memory` and marks it as an `agent-memory.json` attachment.
      parameters:
        - $ref: '#/components/parameters/ExternalUserID'
        - $ref: '#/components/parameters/LegacyUser'
      responses:
        '200':
          $ref: '#/components/responses/MemoryExportDownload'
        default:
          $ref: '#/components/responses/Error'
  /agents/memory/settings:
    parameters:
      - $ref: '#/components/parameters/ExternalUserID'
      - $ref: '#/components/parameters/LegacyUser'
    get:
      tags: [Memory]
      summary: Get the external user's Agent Memory settings
      operationId: getAgentMemorySettings
      description: Returns the current per-user memory and automatic-capture switches with their optimistic-concurrency revision.
      responses:
        '200':
          $ref: '#/components/responses/MemorySettingsEnvelope'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [Memory]
      summary: Update the external user's Agent Memory settings
      operationId: updateAgentMemorySettings
      description: Updates per-user memory switches when allowed by the published Agent configuration. `expected_revision` is required to reject stale updates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemorySettingsPatchRequest'
      responses:
        '200':
          $ref: '#/components/responses/MemorySettingsEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /agents/memory/{key}:
    parameters:
      - name: key
        in: path
        required: true
        schema: {type: string}
      - $ref: '#/components/parameters/ExternalUserID'
      - $ref: '#/components/parameters/LegacyUser'
    put:
      tags: [Memory]
      summary: Set one writable memory slot
      operationId: setAgentMemorySlot
      description: Writes an enabled slot declared by the latest published Agent configuration. Use `expected_revision` to prevent lost updates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemorySlotUpdateRequest'
      responses:
        '200':
          $ref: '#/components/responses/MemorySlotEnvelope'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Memory]
      summary: Delete one writable memory slot
      operationId: clearAgentMemorySlot
      description: Clears one enabled slot. Use the optional revision check to reject stale writes.
      parameters:
        - name: expected_revision
          in: query
          description: Current slot revision expected by the caller.
          schema: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          $ref: '#/components/responses/MemorySlotEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /agents/memory/operations/{operation_id}/undo:
    post:
      tags: [Memory]
      summary: Undo a direct memory operation
      operationId: undoAgentMemoryOperation
      description: Restores the operation's previous value while the operation is unexpired and still matches the current revision.
      parameters:
        - name: operation_id
          in: path
          required: true
          description: Last operation id returned by a slot value or a `memory_*` event.
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/ExternalUserID'
        - $ref: '#/components/parameters/LegacyUser'
      responses:
        '200':
          $ref: '#/components/responses/MemoryUndoEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /agents/memory/history:
    get:
      tags: [Memory]
      summary: List memory history
      operationId: listAgentMemoryHistory
      description: >-
        Lists the user's memory changes, newest first. Each commit lists the files it changed with their content before
        and after, the user's words the change was based on, and why it was made. Content and quotes are purged after 30
        days or when all memory is cleared; the records are kept for 180 days. Needs the relationship memory store.
      parameters:
        - $ref: '#/components/parameters/ExternalUserID'
        - $ref: '#/components/parameters/LegacyUser'
        - name: key
          in: query
          description: Limit the history to one memory slot.
          schema: {type: string}
        - name: limit
          in: query
          description: Commits per page, 1 to 50.
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
        - name: before
          in: query
          description: The previous page's `next_before`; returns older commits.
          schema: {type: string, format: date-time}
      responses:
        '200':
          $ref: '#/components/responses/MemoryHistoryEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /agents/memory/history/{version_id}/revert:
    post:
      tags: [Memory]
      summary: Revert a memory change
      operationId: revertAgentMemoryVersion
      description: >-
        Writes back the content a slot had before this change, as a new change. Only the latest change to a slot whose
        content is still kept can be reverted (`revertible` in the history); otherwise the request fails with a conflict.
      parameters:
        - name: version_id
          in: path
          required: true
          description: A version id from the history.
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/ExternalUserID'
        - $ref: '#/components/parameters/LegacyUser'
      responses:
        '200':
          $ref: '#/components/responses/MemoryRevertEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /agents/memory/archive:
    get:
      tags: [Memory]
      summary: List the memory archive
      operationId: listAgentMemoryArchive
      description: >-
        Lists the user's memory archive, newest first: older memory moved out of full memory files, which the Agent
        searches when its files do not answer a question about the user. The archive keeps up to 500 entries and drops
        the oldest beyond that. It is cleared with all memory and included in the export. Needs the relationship memory
        store.
      parameters:
        - $ref: '#/components/parameters/ExternalUserID'
        - $ref: '#/components/parameters/LegacyUser'
      responses:
        '200':
          $ref: '#/components/responses/MemoryArchiveEnvelope'
        default:
          $ref: '#/components/responses/Error'
  /agents/memory/archive/{entry_id}:
    delete:
      tags: [Memory]
      summary: Delete a memory archive entry
      operationId: deleteAgentMemoryArchiveEntry
      description: Removes one entry from the user's memory archive. Allowed while memory is off.
      parameters:
        - name: entry_id
          in: path
          required: true
          description: An entry id from the archive.
          schema: {type: string, format: uuid}
        - $ref: '#/components/parameters/ExternalUserID'
        - $ref: '#/components/parameters/LegacyUser'
      responses:
        '200':
          $ref: '#/components/responses/MemoryArchiveDeleteEnvelope'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    ConversationID:
      name: conversation_id
      in: path
      required: true
      description: Conversation UUID returned by chat or the conversation list.
      schema: {type: string, format: uuid}
    MessageID:
      name: message_id
      in: path
      required: true
      description: Assistant message UUID returned by `message_start` or message history.
      schema: {type: string, format: uuid}
    ExternalUserID:
      name: X-External-User-ID
      in: header
      required: true
      description: |-
        Stable, opaque end-user identifier supplied by the integration's trusted
        backend. It is case-sensitive, limited to 128 Unicode characters, and
        scopes conversations, stream recovery, continuations, files, and Memory.
        Do not send email addresses, phone numbers, or other direct personal data.
      schema:
        type: string
        minLength: 1
        maxLength: 128
    LegacyUser:
      name: user
      in: query
      deprecated: true
      description: Deprecated compatibility parameter. Use `X-External-User-ID`; if both are sent they must match exactly.
      schema:
        type: string
        maxLength: 128
    Page:
      name: page
      in: query
      description: One-based page number.
      schema: {type: integer, minimum: 1, default: 1}
    Limit:
      name: limit
      in: query
      description: Maximum conversations to return. Runtime caps this value at 100.
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    SearchLimit:
      name: limit
      in: query
      description: Maximum search results to return.
      schema: {type: integer, minimum: 1, maximum: 50, default: 20}
    MessageLimit:
      name: limit
      in: query
      description: Maximum messages to return. Runtime caps this value at 200.
      schema: {type: integer, minimum: 1, maximum: 200, default: 100}
  responses:
    AgentEventStream:
      description: |-
        Native Server-Sent Events stream. The native `event:` value selects the
        payload schema in `x-zgi-sse-event-data-schemas`. The JSON `data:` line
        has shape `{ "event": eventName, "data": eventPayload }`. Persist each
        SSE `id:` for reconnect; an event without `id:` is not recoverable.
      content:
        text/event-stream:
          schema:
            type: string
            example: |-
              id: 1715750400000-0
              event: message
              data: {"event":"message","data":{"conversation_id":"…","message_id":"…","answer":"Hello"}}
      headers:
        X-ZGI-Conversation-ID:
          description: Present for newly prepared chat and regeneration streams so the conversation can be recovered before the first SSE frame is read.
          schema: {type: string, format: uuid}
        X-ZGI-Message-ID:
          description: Present for newly prepared chat and regeneration streams so the message can be recovered before the first SSE frame is read.
          schema: {type: string, format: uuid}
    SuccessEnvelope:
      description: Successful response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    ConversationEnvelope:
      description: Conversation response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConversationEnvelope'
    ConversationListEnvelope:
      description: Paginated conversation response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConversationListEnvelope'
    MessageListEnvelope:
      description: Paginated message response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageListEnvelope'
    SearchResultsEnvelope:
      description: Conversation and message search results
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SearchResultsEnvelope'
    StopConversationEnvelope:
      description: Stop result
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StopConversationEnvelope'
    DeleteConversationEnvelope:
      description: Conversation deletion result
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DeleteConversationEnvelope'
    MemoryExportEnvelope:
      description: Agent Memory slots and values for the supplied external user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MemoryExportEnvelope'
    MemoryExportDownload:
      description: Downloadable Agent Memory export
      headers:
        Content-Disposition:
          description: Attachment filename; currently `attachment; filename="agent-memory.json"`.
          schema: {type: string}
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MemoryExportEnvelope'
    MemorySlotEnvelope:
      description: Updated or cleared Agent Memory slot
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MemorySlotEnvelope'
    MemorySettingsEnvelope:
      description: Per-user Agent Memory settings
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MemorySettingsEnvelope'
    MemoryClearEnvelope:
      description: Clear-all result
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MemoryClearEnvelope'
    MemoryUndoEnvelope:
      description: Undo result
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MemoryUndoEnvelope'
    MemoryHistoryEnvelope:
      description: Memory history page
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MemoryHistoryEnvelope'
    MemoryRevertEnvelope:
      description: Revert result
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MemoryRevertEnvelope'
    MemoryArchiveEnvelope:
      description: Memory archive
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MemoryArchiveEnvelope'
    MemoryArchiveDeleteEnvelope:
      description: Deleted archive entry
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MemoryArchiveDeleteEnvelope'
    Error:
      description: Error response. The HTTP status reflects the error class.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    SSEEnvelope:
      type: object
      required: [event, data]
      description: JSON encoded on an SSE `data:` line. The native SSE `id:` and `event:` lines are outside this object.
      properties:
        event:
          $ref: '#/components/schemas/AgentEventName'
        data:
          type: object
          description: Event-specific payload described by the matching event data schema.
          additionalProperties: true
    AgentEventName:
      type: string
      enum:
        - message_start
        - message
        - message_retract
        - message_end
        - error
        - agent_progress
        - agent_intermediate_answer
        - user_input_requested
        - token_budget_requested
        - token_usage_updated
        - file_parse_start
        - file_parse_end
        - file_parse_error
        - skill_load_start
        - skill_load_end
        - skill_reference_read
        - skill_call_start
        - skill_call_end
        - skill_call_error
        - skill_artifact_created
        - tool_governance_decision
        - memory_create
        - memory_update
        - memory_delete
        - memory_clear
        - workflow_started
        - node_started
        - node_finished
        - workflow_paused
        - workflow_resumed
        - approval_requested
        - approval_result_filled
        - approval_expired
        - question_answer_requested
        - question_answer_submitted
        - iteration_started
        - iteration_next
        - iteration_completed
        - iteration_succeeded
        - iteration_failed
        - loop_started
        - loop_next
        - loop_completed
        - loop_succeeded
        - loop_failed
        - workflow_finished
        - workflow_failed
        - workflow_stopped
        - text_chunk
        - text_replace
    EventIdentity:
      type: object
      description: Identity and replay metadata shared by Agent SSE event payloads.
      required: [conversation_id, message_id]
      properties:
        conversation_id: {type: string, format: uuid, description: Conversation that owns the stream.}
        message_id: {type: string, format: uuid, description: Assistant message whose execution emitted the event.}
        event_id: {type: string, description: Recoverable SSE id copied into persisted event payloads.}
        sequence: {type: integer, format: int64, description: Sequence component of a recoverable SSE id.}
        created_at: {type: integer, format: int64, description: Unix seconds.}
        created_at_ms: {type: integer, format: int64, description: Unix milliseconds when available.}
    MessageStartEventData:
      description: Emitted after the assistant message record is created and before answer deltas.
      allOf:
        - $ref: '#/components/schemas/EventIdentity'
        - type: object
          required: [parent_id, title, model, replace, created_at]
          properties:
            parent_id: {type: string, nullable: true, description: Parent message UUID, or an empty string for a root message.}
            title: {type: string, description: Conversation title at message creation time.}
            model: {type: string, description: Published model selected for execution.}
            replace: {type: boolean, description: True when regeneration replaces a prior branch result.}
    MessageEventData:
      description: Incremental visible assistant-answer chunk.
      allOf:
        - $ref: '#/components/schemas/EventIdentity'
        - type: object
          required: [answer]
          properties:
            answer: {type: string, description: Text delta to append to the visible assistant answer.}
    MessageRetractEventData:
      description: Removes previously streamed candidate text from the final answer and optionally preserves it as process output.
      allOf:
        - $ref: '#/components/schemas/EventIdentity'
        - type: object
          required: [presentation_disposition]
          properties:
            presentation_disposition:
              type: string
              enum: [process, discard]
              description: Move previously streamed candidate text to process UI, or remove it entirely.
            answer: {type: string, description: Candidate text affected by the retraction when supplied.}
    TokenUsageUpdatedEventData:
      description: Provider-reported model token usage update emitted after each model invocation. When an API task supplies a token budget, task_token_budget is also included with the cumulative budget state.
      allOf:
        - $ref: '#/components/schemas/EventIdentity'
        - type: object
          required: [usage]
          properties:
            usage:
              $ref: '#/components/schemas/TokenUsage'
            task_token_budget:
              $ref: '#/components/schemas/TaskTokenBudget'
    TokenUsage:
      type: object
      required: [prompt_tokens, completion_tokens, total_tokens]
      properties:
        prompt_tokens: {type: integer, minimum: 0, description: Prompt tokens reported for the model invocation.}
        completion_tokens: {type: integer, minimum: 0, description: Completion tokens reported for the model invocation.}
        total_tokens: {type: integer, minimum: 0, description: Total tokens charged for the model invocation.}
    TaskTokenBudget:
      type: object
      required: [used_tokens, max_tokens, remaining_tokens, status]
      properties:
        used_tokens: {type: integer, minimum: 0, description: Cumulative provider-reported tokens consumed by this task.}
        max_tokens: {type: integer, minimum: 1, description: Maximum tokens configured for this task.}
        remaining_tokens: {type: integer, minimum: 0, description: Remaining task budget after the latest usage update.}
        status: {type: string, enum: [running, exhausted, waiting, stopped], description: Current task budget status.}
    MessageEndEventData:
      description: Ends the current streaming phase; waiting statuses require a matching continuation endpoint.
      allOf:
        - $ref: '#/components/schemas/EventIdentity'
        - type: object
          required: [status, metadata]
          properties:
            status:
              type: string
              enum: [completed, stopped, error, failed, waiting_approval, waiting_question, waiting_budget]
              description: Final status, or a resumable waiting state for this streaming phase.
            answer: {type: string, description: Complete stored answer when supplied.}
            metadata: {type: object, additionalProperties: true, description: Public runtime metadata, including usage and continuation state.}
    ErrorEventData:
      description: Client-safe streaming or runtime failure.
      allOf:
        - $ref: '#/components/schemas/EventIdentity'
        - type: object
          required: [message]
          properties:
            message: {type: string, description: Client-safe error message.}
            code:
              description: Stable structured code when available. Legacy application codes are integers; runtime-specific codes are strings.
              oneOf:
                - type: integer
                - type: string
            params: {type: object, additionalProperties: true, description: Optional structured context safe to expose to clients.}
    AgentProgressEventData:
      description: Coarse model-processing progress without private reasoning text.
      allOf:
        - $ref: '#/components/schemas/EventIdentity'
        - type: object
          required: [phase, progress_id, activity, stage, source, status, round, elapsed_ms, created_at]
          properties:
            phase: {type: string, enum: [model_processing], description: Stable progress event family.}
            progress_id: {type: string, description: Stable message-and-model-round identifier.}
            activity: {type: string, enum: [awaiting_response, reviewing_tool_result, reasoning, preparing_action], description: Current high-level activity safe to present to the user.}
            stage: {type: string, enum: [initial, extended, long_running], description: Elapsed-time stage for progressive UI messaging.}
            source: {type: string, enum: [runtime, provider_signal], description: Whether progress was inferred by the runtime or emitted by the provider.}
            status: {type: string, enum: [running], description: Execution remains in progress.}
            round: {type: integer, minimum: 1, description: One-based model round within the message.}
            elapsed_ms: {type: integer, format: int64, minimum: 0, description: Milliseconds elapsed in the current model round.}
    IntermediateAnswerEventData:
      description: Structured interim answer that can be rendered separately from the final answer.
      allOf:
        - $ref: '#/components/schemas/EventIdentity'
        - type: object
          required: [answer_id, content, delta, index, done, status]
          properties:
            answer_id: {type: string, description: Stable id used to group chunks for one intermediate answer.}
            title: {type: string, description: Optional user-facing intermediate-answer title.}
            content: {type: string, description: Full content or delta according to delta.}
            delta: {type: boolean, description: Append content when true; replace the grouped content when false.}
            index: {type: integer, minimum: 0, description: Zero-based chunk or item index.}
            done: {type: boolean, description: Whether this intermediate answer is complete.}
            status: {type: string, description: Intermediate-answer lifecycle status.}
    UserInputOption:
      type: object
      description: Selectable answer displayed for a user-input question.
      required: [label]
      properties:
        label: {type: string, description: Value and label presented to the user.}
        description: {type: string, description: Optional explanatory text for the option.}
    UserInputQuestion:
      type: object
      description: One question the host page must present before resuming the Agent.
      required: [id, question]
      properties:
        id: {type: string, description: Key to use in the continuation `answers` object.}
        question: {type: string, description: User-facing question text.}
        options:
          type: array
          description: Optional choices; omitted for free-form answers.
          items:
            oneOf:
              - $ref: '#/components/schemas/UserInputOption'
              - type: string
    UserInputRequestedEventData:
      description: Pauses the Agent until answers are submitted. Route `source=agent_workflow_question_answer` to workflow continuation; route all other values to the Skill user-input continuation endpoint.
      allOf:
        - $ref: '#/components/schemas/EventIdentity'
        - type: object
          required: [request_id, questions, created_at]
          properties:
            source: {type: string, description: Routing discriminator. `agent_workflow_question_answer` means this projected event must use workflow continuation; absent or other values use the Skill user-input continuation endpoint.}
            request_id: {type: string, description: Prompt correlation id; use it as the Skill continuation path id only when source is not `agent_workflow_question_answer`.}
            workflow_run_id: {type: string, description: Originating workflow run for workflow-generated prompts.}
            node_id: {type: string, description: Originating workflow node for workflow-generated prompts.}
            round: {type: integer, minimum: 1, description: Prompt round when repeated input is requested.}
            message: {type: string, description: Optional introductory instruction for the questions.}
            questions:
              type: array
              description: Questions whose ids become keys in the continuation answers object.
              items: {$ref: '#/components/schemas/UserInputQuestion'}
    TokenBudgetRequestedEventData:
      description: Pauses an API task after its configured token budget is exhausted. This independent event never contains user-input questions.
      allOf:
        - $ref: '#/components/schemas/EventIdentity'
        - type: object
          required: [request_id, request_kind, message, token_budget, actions, created_at]
          properties:
            request_id: {type: string, description: Opaque continuation id for this budget pause.}
            request_kind: {type: string, enum: [task_token_budget], description: Stable discriminator for the independent task-budget continuation protocol.}
            message: {type: string, description: User-facing budget exhaustion message.}
            token_budget:
              $ref: '#/components/schemas/TaskTokenBudget'
            actions:
              type: array
              minItems: 1
              description: Actions allowed for resolving the budget pause.
              items:
                type: object
                required: [id, label]
                properties:
                  id: {type: string, enum: [add, stop]}
                  label: {type: string}
    FileParseEventData:
      description: Start, completion, or failure state for one uploaded file being prepared for the Agent.
      allOf:
        - $ref: '#/components/schemas/EventIdentity'
        - type: object
          required: [file_id, name, kind, index, total, status]
          properties:
            file_id: {type: string, format: uuid, description: Uploaded file being parsed.}
            name: {type: string, description: Original filename for progress display.}
            kind: {type: string, description: File or content category selected by the parser.}
            index: {type: integer, minimum: 1, description: One-based file position in this request.}
            total: {type: integer, minimum: 1, description: Total files being prepared.}
            status: {type: string, enum: [parsing, completed, error], description: Current parse result.}
            content_status: {type: string, description: Extracted-content availability or filtering status.}
            content_chars: {type: integer, minimum: 0, description: Number of extracted text characters.}
            from_cache: {type: boolean, description: Whether parsed content was reused from cache.}
            vision_detail: {type: string, description: Vision-processing detail level when applicable.}
            filtered_reason: {type: string, description: Why extracted content was filtered or unavailable.}
            message: {type: string, description: Parse error message for `file_parse_error`.}
    SkillEventData:
      description: Common public payload for Skill reference reads and tool invocation lifecycle events.
      allOf:
        - $ref: '#/components/schemas/EventIdentity'
        - type: object
          required: [skill_id]
          properties:
            skill_id: {type: string, description: Skill that owns the reference or tool.}
            tool_name: {type: string, description: Invoked tool name when applicable.}
            invocation_id: {type: string, description: Stable id correlating start, end, error, and artifact events.}
            kind: {type: string, description: Reference or invocation kind.}
            path: {type: string, description: Reference path for `skill_reference_read`.}
            arguments: {type: object, additionalProperties: true, description: Public/summarized tool arguments.}
            arguments_summary: {type: object, additionalProperties: true, description: Redacted compact argument summary for presentation.}
            status: {type: string, description: Skill or tool lifecycle status.}
            duration_ms: {type: integer, format: int64, minimum: 0, description: Invocation duration in milliseconds.}
            result: {type: object, additionalProperties: true, description: Public/summarized result.}
            message: {type: string, description: Client-safe status or failure message.}
            error_code: {type: string, description: Stable invocation error code when supplied.}
            governance: {type: object, additionalProperties: true, description: Public governance decision metadata.}
            instruction_digest: {type: string, description: Digest identifying the effective Skill instructions.}
            instruction_chars: {type: integer, minimum: 0, description: Character count of the effective Skill instructions.}
            effective_version: {type: string, description: Effective Skill version.}
            policy_state: {type: string, description: Skill policy evaluation state.}
            access_status: {type: string, description: Skill reference or tool access result.}
    SkillArtifactEventData:
      description: Public metadata for a file artifact created by a Skill invocation.
      allOf:
        - $ref: '#/components/schemas/SkillEventData'
        - type: object
          properties:
            artifact_id: {type: string, description: Runtime artifact identifier.}
            artifact_type: {type: string, enum: [file], description: Artifact category.}
            file_id: {type: string, description: Public file identifier when persisted.}
            tool_file_id: {type: string, description: Tool-runtime file identifier when different from file_id.}
            file_type: {type: string, description: Application-specific file category.}
            filename: {type: string, description: Suggested download filename.}
            extension: {type: string, description: Filename extension without a leading dot.}
            mime_type: {type: string, description: Artifact media type.}
            size: {type: integer, format: int64, minimum: 0, description: Artifact size in bytes.}
            url: {type: string, description: Public or signed artifact URL when available.}
            download_url: {type: string, description: Download-specific URL when available.}
            access_mode: {type: string, enum: [authenticated], description: Protected files omit URLs and require the authenticated conversation file endpoint.}
            transfer_method: {type: string, description: How the artifact can be retrieved.}
            lifecycle: {type: string, description: Retention or persistence state.}
            expires_at: {description: Expiration time in the runtime-provided representation.}
            target: {type: string, description: Requested asset destination when applicable.}
            workspace_id: {type: string, format: uuid, description: Destination workspace when applicable.}
            folder_id: {type: string, description: Destination folder when applicable.}
            upload_file_id: {type: string, description: Uploaded-file record associated with the artifact.}
            correlation_id: {type: string, description: Correlates the artifact with a governed operation.}
            operation_id: {type: string, description: Asset operation identifier.}
            asset_operation_audit: {type: object, additionalProperties: true, description: Public asset-operation audit summary.}
    ToolGovernanceDecisionEventData:
      description: Authorization decision for a published Agent tool invocation. Ordinary calls remain non-interactive. An admitted platform CLI call may require explicit approval through the tool-governance continuation endpoint; resource authorization is still mandatory.
      allOf:
        - $ref: '#/components/schemas/SkillEventData'
        - type: object
          required: [correlation_id, decision, requires_approval]
          properties:
            correlation_id: {type: string, description: Stable id for correlating the authorization decision with tool lifecycle and audit records.}
            decision: {type: string, description: Non-interactive authorization result, such as allowed or denied.}
            requires_approval: {type: boolean, description: True only for a server-authorized interactive platform CLI invocation.}
            reason: {type: string, description: User-facing rationale for the decision.}
            risk_level: {type: string, description: Public risk classification.}
            effect: {type: string, description: Expected external side effect.}
            asset_type: {type: string, description: Asset category affected by the tool.}
            approval_every_invocation: {type: boolean, description: Whether policy forbids reusing an approval for later invocations.}
            tool_id: {type: string, description: Runtime tool identifier.}
            governed_tool_id: {type: string, description: Stable governed-tool definition id.}
            provider_type: {type: string, description: Integration provider category.}
            provider_id: {type: string, description: Integration provider identifier.}
            external_destination: {type: string, description: External system or destination affected by the tool.}
            integration_id: {type: string, description: Integration configuration identifier.}
            action_id: {type: string, description: Provider action identifier.}
            connection_name: {type: string, description: Internal connection name safe to expose.}
            connection_display_name: {type: string, description: User-facing connection label.}
            asset_operation_audit: {type: object, additionalProperties: true, description: Public asset-operation audit summary.}
            approval_event: {type: object, additionalProperties: true, description: Public authorization metadata for auditing when available.}
    MemoryMutationEventData:
      description: Published Agent Memory mutation notification for the current external user.
      allOf:
        - $ref: '#/components/schemas/EventIdentity'
        - type: object
          required: [memory_scope, action, status]
          properties:
            memory_scope: {type: string, enum: [agent], description: Always agent for the published Agent API.}
            action: {type: string, enum: [create, update, delete, clear], description: Mutation performed.}
            key: {type: string, description: Published Agent Memory slot key.}
            display_name: {type: string, description: User-facing slot name.}
            status: {type: string, description: Overall mutation event status.}
            mutation_status: {type: string, description: Published Agent Memory mutation result.}
            source_kind: {type: string, description: Mutation source such as manager or automatic extraction.}
            operation_id: {type: string, format: uuid, description: Operation id accepted by the memory undo endpoint.}
            revision: {type: integer, format: int64, minimum: 0, description: Slot revision after the mutation.}
            undoable_until: {type: string, format: date-time, description: RFC 3339 deadline for undo when available.}
    WorkflowEventData:
      allOf:
        - $ref: '#/components/schemas/EventIdentity'
        - type: object
          description: Workflow progress payload. Node-type-specific fields are additive; preserve unknown fields.
          properties:
            id: {type: string, description: Workflow run, node execution, or container id depending on the event family.}
            workflow_run_id: {type: string, description: Stable workflow execution id shared by events from one run.}
            workflow_id: {type: string, description: Published workflow definition id.}
            task_id: {type: string, description: Runtime task id when the workflow engine supplies one.}
            node_id: {type: string, description: Workflow graph node id.}
            node_type: {type: string, description: Workflow node kind.}
            node_title: {type: string, description: User-facing node title used by approval and question events.}
            title: {type: string, description: User-facing node or container title.}
            index: {type: integer, minimum: 0, description: Zero-based iteration or loop item index.}
            iteration_index: {type: integer, minimum: 0, description: Explicit zero-based iteration index when supplied.}
            loop_index: {type: integer, minimum: 0, description: Explicit zero-based loop index when supplied.}
            status: {type: string, description: Workflow, node, or container lifecycle status.}
            round: {type: integer, minimum: 1, description: One-based repeated question or approval round.}
            iteration: {type: integer, minimum: 0, description: Runtime iteration counter when supplied.}
            token: {type: string, description: Copy to the workflow continuation request's `approval_token` for API/debug approval flows.}
            form_id: {type: string, description: Approval form id used to correlate request, result, and expiration events.}
            content: {description: Approval content in the workflow-provided structured or textual form.}
            fields: {type: array, description: Approval form field definitions., items: {type: object, additionalProperties: true}}
            actions: {type: array, description: Approval actions available to the user., items: {type: object, additionalProperties: true}}
            submit_methods: {type: object, additionalProperties: true, description: Submission methods advertised by the workflow runtime.}
            expires_at: {description: Approval expiration time in the workflow-provided representation.}
            action_id: {type: string, description: Approval action selected by the user.}
            action_label: {type: string, description: User-facing label of the selected approval action.}
            rendered_content: {type: string, description: Rendered approval summary after submission.}
            question: {type: string, description: User-facing workflow question text.}
            choices: {type: array, description: Optional workflow question choices; items are runtime-defined., items: {}}
            answer: {description: Submitted workflow answer in the runtime-defined scalar or structured form.}
            trigger_id: {type: string, description: Runtime trigger id for the submitted answer.}
            reasons: {type: array, description: Reasons the workflow entered a paused or terminal state., items: {}}
            inputs: {type: object, additionalProperties: true, description: Public workflow, node, or container inputs.}
            inputs_truncated: {type: boolean, description: Whether inputs were shortened for the public stream.}
            process_data: {description: Runtime-provided intermediate node processing data.}
            outputs: {type: object, additionalProperties: true, description: Public workflow, node, or container outputs.}
            outputs_truncated: {type: boolean, description: Whether outputs were shortened for the public stream.}
            output_handle: {type: string, description: Handle for retrieving or correlating larger node output.}
            steps: {type: integer, minimum: 0, description: Completed steps in an iteration or loop container.}
            total_steps: {type: integer, minimum: 0, description: Total workflow or container steps when known.}
            total_tokens: {type: integer, minimum: 0, description: Aggregated token usage when exposed by the runtime.}
            elapsed_time: {type: number, minimum: 0, description: Elapsed execution time in seconds.}
            pre_loop_output: {description: Runtime-defined value captured before a loop executes.}
            metadata: {type: object, additionalProperties: true, description: Public workflow metadata.}
            execution_metadata: {type: object, additionalProperties: true, description: Public node execution metadata.}
            extras: {type: object, additionalProperties: true, description: Additional forward-compatible runtime fields.}
            error: {description: Workflow, node, iteration, or loop error in runtime-provided form.}
            finished_at: {type: integer, format: int64, description: Completion time in Unix seconds.}
            finished_at_ms: {type: integer, format: int64, description: Completion time in Unix milliseconds.}
            paused_at: {type: integer, format: int64, description: Pause time in Unix seconds.}
          additionalProperties: true
    ApprovalRequestedEventData:
      description: A workflow approval wait. Render the nested approval_form and continue the same message with the top-level approval_token when inline approval is allowed.
      allOf:
        - $ref: '#/components/schemas/EventIdentity'
        - type: object
          required: [workflow_run_id, node_id, approval_form_id, ui_approval_allowed, approval_form]
          properties:
            workflow_run_id: {type: string, description: Stable workflow execution id for the paused run.}
            workflow_id: {type: string, description: Published workflow definition id.}
            node_id: {type: string, description: Approval node id in the workflow graph.}
            node_type: {type: string, description: Workflow node kind; normally approval.}
            title: {type: string, description: Optional event-level display title; prefer approval_form.node_title.}
            status: {type: string, description: Approval or workflow pause status supplied by the runtime.}
            approval_form_id: {type: string, description: Stable approval form id; normally matches approval_form.id.}
            approval_token: {type: string, description: Credential to copy unchanged into WorkflowContinuationRequest.approval_token. Omitted when inline API approval is not allowed.}
            approval_url: {type: string, description: Optional out-of-band approval URL supplied by the workflow.}
            ui_approval_allowed: {type: boolean, description: Whether this API client may render and submit the approval. When false, approval credentials are redacted and the configured approval channel must be used.}
            approval_form:
              $ref: '#/components/schemas/ApprovalForm'
          additionalProperties: true
    ApprovalForm:
      type: object
      description: Nested form rendered for approval_requested. Use only the fields and actions advertised here.
      properties:
        id: {type: string, description: Approval form id.}
        node_id: {type: string, description: Workflow approval node id.}
        node_title: {type: string, description: User-facing approval title.}
        content: {description: Textual or structured approval summary; render it as safe data and never execute embedded HTML.}
        fields:
          type: array
          description: Input definitions to render before submission.
          items: {$ref: '#/components/schemas/ApprovalFormField'}
        actions:
          type: array
          description: The complete set of actions the client may submit; never invent actions when this list is empty.
          items: {$ref: '#/components/schemas/ApprovalAction'}
        submit_methods:
          $ref: '#/components/schemas/ApprovalSubmitMethods'
        expiration_at:
          description: Approval deadline, normally Unix seconds; disable submission after this time.
          oneOf:
            - {type: integer, format: int64}
            - {type: string}
        token: {type: string, description: Compatibility copy of the approval credential. Prefer the event-level approval_token. Omitted when inline API approval is not allowed.}
        resolved_default_values: {type: object, additionalProperties: true, description: Runtime-resolved defaults that may be used to initialize form controls.}
      additionalProperties: true
    ApprovalFormField:
      type: object
      description: Runtime-defined approval input. Unknown properties must be preserved for forward compatibility.
      properties:
        id: {type: string, description: Stable field identifier when supplied.}
        key: {type: string, description: Stable input key when id is absent.}
        name: {type: string, description: Stable input name when id and key are absent.}
        label: {type: string, description: User-facing field label.}
        type: {type: string, description: Control type such as text, textarea, select, number, or checkbox.}
        required: {type: boolean, description: Whether a value is required before submission.}
        default: {description: Runtime-provided default value.}
        default_value: {description: Compatibility form of the runtime-provided default value.}
        options:
          type: array
          description: Runtime-defined choices for select-like controls.
          items: {}
      additionalProperties: true
    ApprovalAction:
      type: object
      description: One server-advertised approval operation.
      required: [id]
      properties:
        id: {type: string, description: Action id to send as WorkflowContinuationRequest.action.}
        label: {type: string, description: User-facing action label.}
        style: {type: string, description: Optional presentation hint such as primary or danger.}
      additionalProperties: true
    ApprovalSubmitMethods:
      type: object
      description: Channels configured for this approval form.
      properties:
        webapp:
          $ref: '#/components/schemas/ApprovalWebAppSubmitMethod'
      additionalProperties: true
    ApprovalWebAppSubmitMethod:
      type: object
      description: Inline WebApp and Agent API approval-channel configuration.
      properties:
        enabled: {type: boolean, description: Whether published WebApp and Agent API clients may submit this approval.}
      additionalProperties: true
    WorkflowTextEventData:
      description: Text emitted by a delegated chat workflow; text_chunk appends and text_replace replaces visible content.
      allOf:
        - $ref: '#/components/schemas/WorkflowEventData'
        - type: object
          properties:
            text: {type: string, description: Workflow-provided text payload.}
            answer: {type: string, description: Alternate answer field supplied by some workflow runtimes.}
            data: {type: object, additionalProperties: true, description: Additional workflow text metadata.}
    PublishedApplicationInfo:
      type: object
      required: [name, description, tags, mode, author_name, agent_id, icon, icon_type, icon_url, version, version_uuid]
      description: Direct success object returned by `/info`; it is not wrapped in the standard success envelope.
      properties:
        name: {type: string, description: Published application name.}
        description: {type: string, description: Published application description.}
        tags:
          type: array
          description: Contains the resolved application mode.
          items: {type: string}
        mode: {type: string, enum: [agent, workflow, chat-workflow], description: Runtime mode inferred from the API key's bound application.}
        author_name: {type: string, description: Application author label., example: ZGI}
        agent_id: {type: string, format: uuid, description: Bound application id; the legacy field name is retained for compatibility.}
        icon: {type: string, description: Stored icon value.}
        icon_type: {type: string, description: Stored icon type, such as emoji or image.}
        icon_url: {type: string, description: Resolved image URL when the icon type is image.}
        version: {type: string, description: Latest published version label.}
        version_uuid: {type: string, format: uuid, description: Latest published version UUID.}
      example:
        name: Research Assistant
        description: Evidence-backed answers
        tags: [agent]
        mode: agent
        author_name: ZGI
        agent_id: 4c2cb782-748e-4ff4-a34d-796b40f98f16
        icon: bot
        icon_type: emoji
        icon_url: ''
        version: v12
        version_uuid: 7b0df140-fbc1-41ef-9234-611172283b23
    PublishedApplicationParameters:
      type: object
      required: [user_input_form, features, file_upload, agent_memory, system_parameters]
      description: Direct success object returned by `/parameters`; it is not wrapped in the standard success envelope.
      properties:
        user_input_form:
          type: array
          description: Published workflow start variables; empty for Agent mode. Unknown published graph fields are preserved.
          items:
            $ref: '#/components/schemas/WorkflowInputVariable'
        features:
          $ref: '#/components/schemas/PublishedFeatures'
        file_upload:
          $ref: '#/components/schemas/PublishedFileUploadParameters'
        chat_upload_policy:
          $ref: '#/components/schemas/ChatUploadPolicy'
        agent_memory:
          $ref: '#/components/schemas/PublishedAgentMemoryParameters'
        system_parameters:
          $ref: '#/components/schemas/PublishedSystemParameters'
      example:
        user_input_form: []
        features:
          home_title: Start your research
          opening_statement: What should I investigate?
          input_placeholder: Ask a question
          theme_color: '#4F46E5'
          suggested_questions: [Compare the evidence]
          supports_vision: true
        file_upload:
          enabled: true
          number_limits: 5
          allowed_file_types: [document, image]
          transfer_methods: [local_file]
          image: {enabled: true, number_limits: 5, transfer_methods: [local_file]}
        agent_memory: {enabled: true, requires_user: true}
        system_parameters:
          file_size_limit: 50
          image_file_size_limit: 10
          audio_file_size_limit: 100
          video_file_size_limit: 500
          file_upload_count_limit: 10
    WorkflowInputVariable:
      type: object
      additionalProperties: true
      description: One start-node variable copied from a published workflow graph.
      properties:
        variable: {type: string, description: Variable identifier when supplied by the workflow.}
        label: {type: string, description: User-facing field label when supplied.}
        type: {type: string, description: Published input type.}
        required: {type: boolean, description: Whether the input is required.}
        default: {description: Published default value.}
        options:
          type: array
          description: Published selection options when applicable.
          items: {}
    PublishedFeatures:
      type: object
      additionalProperties: true
      description: Published presentation features. Workflow modes can add feature-specific keys.
      properties:
        home_title: {type: string, description: Main landing-page heading.}
        opening_statement: {type: string, description: Introductory text shown before the first user message.}
        input_placeholder: {type: string, description: Suggested placeholder for the chat composer.}
        theme_color: {type: string, description: Published theme color, usually a CSS hex color.}
        suggested_questions:
          type: array
          description: Starter prompts displayed on the landing page.
          items: {type: string}
        supports_vision: {type: boolean, description: Whether the published model can consume image inputs.}
    PublishedFileUploadParameters:
      type: object
      description: Published file-attachment capabilities used to configure the client picker and validation.
      required: [enabled, number_limits, allowed_file_types, transfer_methods, image]
      properties:
        enabled: {type: boolean, description: Whether public file upload is enabled.}
        number_limits: {type: integer, minimum: 0, description: Maximum files accepted by one invocation.}
        allowed_file_types:
          type: array
          description: Published upload categories; new chat configurations use document and image. Legacy workflow categories remain compatible. Use chat_upload_policy.allowed_extensions for the effective extension list.
          items: {type: string}
        transfer_methods:
          type: array
          description: Supported transfer methods; currently local_file.
          items: {type: string, enum: [local_file]}
        image:
          type: object
          description: Image-specific picker and validation capabilities.
          required: [enabled, number_limits, transfer_methods]
          properties:
            enabled: {type: boolean, description: Whether image attachments are enabled.}
            number_limits: {type: integer, minimum: 0, description: Maximum images accepted by one invocation.}
            transfer_methods:
              type: array
              description: Supported image transfer methods; currently local_file.
              items: {type: string, enum: [local_file]}
    ChatUploadPolicy:
      type: object
      description: Server-resolved chat admission limits, independent of model vision support. Sizes are original bytes. Each invocation counts unique attachments only; historical attachments are not added again.
      required: [allowed_file_types, allowed_extensions, number_limit, document_max_bytes, image_max_bytes, turn_max_bytes]
      properties:
        allowed_file_types: {type: array, items: {type: string}, description: Effective upload categories. Legacy workflow categories are preserved.}
        allowed_extensions: {type: array, items: {type: string}, description: Effective platform-maintained extensions without leading dots.}
        number_limit: {type: integer, minimum: 0, description: Maximum unique files submitted in one turn.}
        document_max_bytes: {type: integer, format: int64, maximum: 104857600, description: Original document byte limit; defaults to 50 MiB.}
        image_max_bytes: {type: integer, format: int64, maximum: 104857600, description: Original image byte limit; defaults to 10 MiB.}
        turn_max_bytes: {type: integer, format: int64, enum: [104857600], description: Maximum unique original file bytes per turn; 100 MiB.}
    ChatUploadSelection:
      type: object
      description: Published category selection. Missing policy defaults to documents and images; an empty list disables both.
      properties:
        allowed_file_types:
          type: array
          description: Allowed document/image categories from the frozen published version; an empty list disables attachments.
          uniqueItems: true
          items: {type: string, enum: [document, image]}
    PublishedAgentMemoryParameters:
      type: object
      description: Published Agent Memory capability flags used to enable memory-management UI.
      required: [enabled, requires_user]
      properties:
        enabled: {type: boolean, description: Whether published Agent Memory is enabled.}
        requires_user: {type: boolean, description: Whether the published Memory configuration has enabled user-scoped slots.}
    PublishedSystemParameters:
      type: object
      description: Current upload limits. Size values are in MB. The object can be empty when the file service is unavailable.
      properties:
        file_size_limit: {type: integer, format: int64, minimum: 0, description: General file size limit in MB.}
        image_file_size_limit: {type: integer, format: int64, minimum: 0, description: Image file size limit in MB.}
        audio_file_size_limit: {type: integer, format: int64, minimum: 0, description: Audio file size limit in MB.}
        video_file_size_limit: {type: integer, format: int64, minimum: 0, description: Video file size limit in MB.}
        file_upload_count_limit: {type: integer, minimum: 0, description: Server-side maximum upload count per invocation.}
    ChatRequest:
      type: object
      required: [query]
      description: Chat request for the latest published Agent configuration.
      properties:
        query: {type: string, minLength: 1, description: User input for this turn.}
        conversation_id: {type: string, format: uuid, description: Existing conversation to continue; omit to create one.}
        parent_id: {type: string, format: uuid, description: Parent message when branching from a specific point.}
        file_ids:
          type: array
          description: Temporary uploaded file ids to attach to this message.
          items: {type: string, format: uuid}
        response_mode:
          type: string
          enum: [streaming]
          default: streaming
          description: Response transport. External Agent chat currently supports streaming only.
        user:
          type: string
          deprecated: true
          description: Deprecated compatibility field. Use `X-External-User-ID`; if both are sent they must match exactly.
        max_task_tokens:
          type: integer
          minimum: 1
          maximum: 100000000
          description: Optional per-task model token budget based on provider-reported usage. Enforcement occurs after an in-flight call is counted, so that call may cross the limit; the stream then emits token_budget_requested and waits for an add or stop continuation.
      example:
        query: Summarize the attached report in three bullets.
        conversation_id: f1f7503a-9e28-4af5-9d6d-9e23fb5a8994
        file_ids: [be2453d1-ec7e-42d5-920b-024cc6d477e9]
        response_mode: streaming
    UpdateConversationRequest:
      type: object
      description: Only supplied fields are changed.
      minProperties: 1
      properties:
        title: {type: string, description: New display title. Blank input is normalized to the default title.}
        status: {type: string, description: Conversation lifecycle status, such as normal or archived.}
        current_leaf_message_id: {type: string, format: uuid, description: Message in this conversation to select as the current branch leaf.}
      example: {title: FY 2026 analysis, status: archived}
    RegenerateMessageRequest:
      type: object
      description: Optional replacement input. Omit the body or `query` to reuse the original query.
      properties:
        query: {type: string, description: Replacement user query.}
      example: {query: Give me a shorter answer.}
    UserInputContinuationRequest:
      type: object
      description: Answers a Skill-originated user_input_requested event without creating a new message.
      required: [answers]
      properties:
        answers:
          type: object
          minProperties: 1
          description: Map each `user_input_requested.questions[].id` to the user's answer or selected option value.
          additionalProperties: {type: string}
      example:
        answers: {target: production}
    TaskTokenBudgetContinuationRequest:
      type: object
      description: Continues an API task paused by token budget. Use add with additional_tokens, or stop without additional_tokens.
      required: [action]
      properties:
        action:
          type: string
          enum: [add, stop]
          description: Resolve the budget pause by adding tokens or stopping the task.
        additional_tokens:
          type: integer
          minimum: 1
          maximum: 100000000
          description: Number of tokens to add when action is add. The resulting task limit must not exceed 100000000.
      example: {action: add, additional_tokens: 2048}
    WorkflowContinuationRequest:
      description: Resumes a paused workflow question or approval within the existing Agent message.
      oneOf:
        - type: object
          required: [type, inputs]
          properties:
            type: {type: string, enum: [question_answer], description: Selects workflow question-answer continuation.}
            inputs:
              type: object
              minProperties: 1
              description: Answer values expected by the paused question; commonly `query` and, for a selected choice, `question_answer_option_id`.
              additionalProperties: true
        - type: object
          required: [type, approval_token, action]
          properties:
            type: {type: string, enum: [approval], description: Selects workflow approval continuation.}
            approval_token: {type: string, description: Copy from the `approval_requested` payload's top-level `approval_token`; use `approval_form.token` only as a compatibility fallback.}
            action: {type: string, description: Selected approval action id advertised by the event.}
            inputs:
              type: object
              description: Optional approval form values.
              additionalProperties: true
      example:
        type: question_answer
        inputs: {query: Continue, question_answer_option_id: continue}
    MemorySlotUpdateRequest:
      type: object
      description: Replaces one published Agent Memory slot value for the current external user.
      required: [content]
      properties:
        content: {type: string, description: New slot content within the published slot's max_chars limit.}
        expected_revision: {type: integer, format: int64, minimum: 0, description: Optional optimistic-concurrency revision.}
      example: {content: Prefers concise answers, expected_revision: 2}
    MemorySettingsPatchRequest:
      type: object
      required: [expected_revision]
      properties:
        memory_enabled: {type: boolean, description: Enables or disables memory use for this external user and Agent.}
        auto_capture_enabled: {type: boolean, description: Enables or disables automatic capture when the published Agent allows it.}
        expected_revision: {type: integer, format: int64, minimum: 0, description: Current settings revision required for optimistic concurrency.}
      example: {memory_enabled: true, auto_capture_enabled: true, expected_revision: 3}
    AgentConfigEnvelope:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/AgentConfig'
    AgentConfig:
      type: object
      description: Published Agent identity, landing-page presentation, capability flags, and immutable version metadata.
      required: [agent_id, web_app_id, agent_type, name, description, icon, icon_type, icon_url, home_title, opening_statement, input_placeholder, theme_color, suggested_questions, file_upload_enabled, supports_vision, agent_memory_enabled, memory_requires_user, external_user_required, version, version_uuid]
      properties:
        agent_id: {type: string, format: uuid, description: Published Agent id used by this API Key.}
        web_app_id: {type: string, format: uuid, description: Published web application id bound to the API Key.}
        agent_type: {type: string, description: Published application type, normally AGENT.}
        name: {type: string, description: Agent display name.}
        description: {type: string, description: Agent description shown by the client.}
        icon: {type: string, description: Icon value, interpreted according to icon_type.}
        icon_type: {type: string, description: Icon representation such as emoji or image.}
        icon_url: {type: string, description: Resolved icon URL when an image icon is configured; otherwise empty.}
        home_title: {type: string, description: Main landing-page heading.}
        opening_statement: {type: string, description: Introductory assistant text shown before the first message.}
        input_placeholder: {type: string, description: Suggested placeholder for the chat composer.}
        theme_color: {type: string, description: Published theme color, usually a CSS hex color.}
        suggested_questions:
          type: array
          description: Starter prompts displayed on the landing page.
          items: {type: string}
        file_upload_enabled: {type: boolean, description: Whether the published Agent accepts file attachments.}
        file_upload_policy:
          $ref: '#/components/schemas/ChatUploadSelection'
        supports_vision: {type: boolean, description: Whether the published model can consume image inputs.}
        agent_memory_enabled: {type: boolean, description: Whether Agent Memory is enabled in the published configuration.}
        memory_requires_user: {type: boolean, description: Whether memory operations require an external-user identity.}
        external_user_required: {type: boolean, description: Always true for stateful external Agent operations.}
        version: {type: string, description: Human-readable published version label.}
        version_uuid: {type: string, format: uuid, description: Immutable published version id.}
      example:
        agent_id: 4c2cb782-748e-4ff4-a34d-796b40f98f16
        web_app_id: f8d1dddb-21f1-48c2-bb27-7602a72c4eca
        agent_type: AGENT
        name: Research Assistant
        description: Evidence-backed answers
        icon: bot
        icon_type: emoji
        icon_url: ''
        home_title: Start your research
        opening_statement: What should I investigate?
        input_placeholder: Ask a question
        theme_color: '#4F46E5'
        suggested_questions: [Compare the evidence]
        file_upload_enabled: true
        supports_vision: true
        agent_memory_enabled: true
        memory_requires_user: true
        external_user_required: true
        version: v12
        version_uuid: 7b0df140-fbc1-41ef-9234-611172283b23
    UploadedFile:
      type: object
      description: Metadata returned after a file is stored for later use in a chat request.
