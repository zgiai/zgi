syntax = "proto3";

package zgi.rpc.v1;

option go_package = "github.com/zgiai/zgi/api/pkg/rpc/v1;v1";

service BillingService {
  rpc PreDeductQuota(PreDeductQuotaRequest) returns (PreDeductQuotaResponse);
  rpc SettleQuota(SettleQuotaRequest) returns (SettleQuotaResponse);
  rpc CalculateDualCost(CalculateDualCostRequest) returns (DualCostResponse);
  rpc SettleUsageWithDualTrack(SettleUsageRequest) returns (SettleUsageResponse);
  rpc GetBillingMode(GetBillingModeRequest) returns (BillingModeResponse);
  rpc CheckCreditBalance(CheckCreditBalanceRequest) returns (CheckCreditBalanceResponse);
  rpc PreDeductMeteredUsage(PreDeductMeteredUsageRequest) returns (PreDeductMeteredUsageResponse);
  rpc GetBillingCapabilities(GetBillingCapabilitiesRequest) returns (GetBillingCapabilitiesResponse);
}

message GetBillingCapabilitiesRequest {}

message GetBillingCapabilitiesResponse {
  int32 protocol_version = 1;
  bool tool_postpaid_v2 = 2;
}

message MeteredUsageFact {
  string operation = 1;
  string meter = 2;
  string base_unit = 3;
  int64 quantity = 4;
  map<string, string> dimensions = 5;
}

message PreDeductMeteredUsageRequest {
  string organization_id = 1;
  string model_id = 2;
  string request_id = 3;
  string attempt_id = 4;
  string resource_type = 5;
  string resource_id = 6;
  string resource_name = 7;
  MeteredUsageFact usage = 8;
  // Cross-service model identity; see console billing.proto.
  string provider_name = 9;
  string model_name = 10;
}

message PreDeductMeteredUsageResponse {
  bool success = 1;
  string error_message = 2;
  string deduction_id = 3;
  int64 estimated_credits = 4;
  int64 reserved_credits = 5;
  int64 remaining_credits = 6;
  // Stable cataloged error identity (domain.subject.reason); mirrors the
  // Console contract and supports the error_code compatibility branch.
  string error_code = 7;
}

message PreDeductQuotaRequest {
  string organization_id = 1;
  int64 estimated_credits = 2;
  string model_id = 3;
  string model_name = 4;
  string provider_id = 5;
  string provider_name = 6;
  string request_id = 7;
  string attempt_id = 8;
  string resource_type = 9;
  string resource_id = 10;
  string resource_name = 11;
  string reservation_policy = 12;
  string pricing_snapshot = 13;
  // T4: token reservation remains active; the tool delta settles afterward.
  bool tool_postpaid = 14;
}

message PreDeductQuotaResponse {
  bool success = 1;
  string error_code = 2;
  string error_message = 3;
  int64 remaining_quota = 4;
  string deduction_id = 5;
}

message SettleQuotaRequest {
  string organization_id = 1;
  string deduction_id = 2;
  int64 estimated_credits = 3;
  int64 actual_credits = 4;
  int32 prompt_tokens = 5;
  int32 completion_tokens = 6;
  int32 total_tokens = 7;
  double input_cost = 8;
  double output_cost = 9;
  double total_cost = 10;
  string model_id = 11;
  string model_name = 12;
  string provider_id = 13;
  string provider_name = 14;
  string channel_id = 15;
  string request_id = 16;
  int64 response_time = 17;
  string status = 18;
  string error_message = 19;
  string account_id = 20;
  string app_id = 21;
  string app_type = 22;
  string ip_address = 23;
  string user_agent = 24;
  bool is_streaming = 25;
  bool use_system_provider = 26;
  string attempt_id = 27;
  string resource_type = 28;
  string resource_id = 29;
  string resource_name = 30;
}

message SettleQuotaResponse {
  // Additive authoritative result for platform mirror consumers.
  string tool_settlement_json = 8;
  bool success = 1;
  string error_message = 2;
  int64 remaining_quota = 3;
  int64 used_quota = 4;
  int64 refunded_credits = 5;
  int64 settled_credits = 6;
  string error_code = 7;
}

message CalculateDualCostRequest {
  int32 prompt_tokens = 1;
  int32 completion_tokens = 2;
  string model_id = 3;
  string organization_id = 4;
  string provider = 5;
  string model = 6;
}

message DualCostResponse {
  bool success = 1;
  string error_message = 2;
  int64 input_credits = 3;
  int64 output_credits = 4;
  int64 total_credits = 5;
  double input_usd = 6;
  double output_usd = 7;
  double total_usd = 8;
  string billing_mode = 9;
  string error_code = 10;
}

message SettleUsageRequest {
  string organization_id = 1;
  string model_id = 2;
  string model_name = 3;
  string provider_id = 4;
  string provider_name = 5;
  string channel_id = 6;
  string request_id = 7;
  int32 prompt_tokens = 8;
  int32 completion_tokens = 9;
  int32 total_tokens = 10;
  int64 response_time = 11;
  string status = 12;
  string error_message = 13;
  string account_id = 14;
  string app_id = 15;
  string app_type = 16;
  string ip_address = 17;
  string user_agent = 18;
  bool is_streaming = 19;
  bool use_system_provider = 20;
}

message SettleUsageResponse {
  bool success = 1;
  string error_message = 2;
  int64 credits_deducted = 3;
  double usd_cost = 4;
  string billing_mode = 5;
  bool is_self_paid = 6;
  string error_code = 7;
}

message GetBillingModeRequest {
  string organization_id = 1;
}

message BillingModeResponse {
  bool success = 1;
  string error_message = 2;
  string billing_mode = 3;
  bool is_self_paid = 4;
  string error_code = 5;
}

message CheckCreditBalanceRequest {
  string organization_id = 1;
  int64 estimated_credits = 2;
}

message CheckCreditBalanceResponse {
  bool success = 1;
  string error_message = 2;
  bool sufficient = 3;
  int64 balance = 4;
  string error_code = 5;
}
